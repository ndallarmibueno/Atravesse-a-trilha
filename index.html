<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atravessem a Trilha</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f0ff;--card:#fff;--tx:#1d1b4b;--mut:#5d5a8c;--ln:#d6d1f7;--bad:#d93a24;--good:#0e9a72;--acc:#5a3fe0;--hl:#ffd23f}
@media (prefers-color-scheme:dark){:root{--bg:#16143a;--card:#221f55;--tx:#f2f0ff;--mut:#aaa6dc;--ln:#3a3680;--bad:#ff6b57;--good:#3ddba7;--acc:#8d7bff}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Fredoka',system-ui,sans-serif;font-size:clamp(16px,1.5vw,21px);line-height:1.4}
main{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
h1{font-size:clamp(28px,4.5vw,48px);margin:0 0 6px;line-height:1.05}
h2{font-size:clamp(20px,2.4vw,28px);margin:0 0 8px}
p{margin:0 0 10px;max-width:70ch}
.mut{color:var(--mut)}
.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:14px 18px;margin-top:12px}
.card.ok{border-color:var(--good)}.card.no{border-color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap}
.jogo{display:flex;align-items:center;gap:12px;margin-top:10px}
.bot{font-size:clamp(40px,6vw,66px);line-height:1}
.bub{background:var(--card);border:2px solid var(--bad);border-radius:18px 18px 18px 4px;padding:8px 14px;font-weight:500}
.trail{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
.tile{min-height:clamp(58px,8.5vw,104px);border-radius:14px;border:3px solid var(--ln);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;position:relative;transition:background .3s,border-color .3s}
.tile .ic{font-size:clamp(20px,3vw,36px);line-height:1}
.tile .nm{position:absolute;top:2px;left:6px;font-size:11px;color:var(--mut);font-weight:600}
.tile.trap{border-color:var(--bad)}
.tile.trap.off{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--card))}
.tile.fin{border-color:var(--acc)}
.tile.hit{background:var(--hl);color:#1d1b4b}
.tok{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;font-size:clamp(15px,2.1vw,26px);line-height:1.05}
.tok span.me{outline:3px solid var(--acc);border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-weight:500;font-size:.9em}
.legend s{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{border:3px solid var(--ln);border-radius:999px;padding:2px 12px 2px 6px;background:var(--card);font-weight:600;display:flex;align-items:center;gap:6px}
.chip .e{font-size:1.5em}
.chip.cur{border-color:var(--hl);background:color-mix(in srgb,var(--hl) 40%,var(--card));transform:scale(1.06)}
.chip.fin{border-color:var(--good)}
button{font:inherit;font-weight:600;border-radius:14px;border:3px solid var(--acc);padding:10px 20px;cursor:pointer;color:var(--tx);background:var(--card)}
.btn{background:var(--acc);color:#fff}
.btn.big{font-size:1.2em;padding:13px 26px}
.btn:disabled,button:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent}
:focus-visible{outline:4px solid var(--hl);outline-offset:2px}
.act{text-align:center;margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:10px}
.rule{text-align:left;border:3px solid var(--ln);border-radius:16px;padding:12px 14px;font-weight:500;font-size:.95em}
.rule b{display:block;font-size:1.08em;margin-bottom:3px}
.rule.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.bar{height:14px;border-radius:7px;background:var(--ln);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.av-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin-top:10px}
.av-pick button{font-size:2.2em;padding:8px;border-radius:18px}
.dice{text-align:center}
.die{font-size:clamp(64px,10vw,110px);line-height:1}
.roll{font-size:clamp(64px,10vw,110px);animation:sh .35s infinite}
@keyframes sh{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.roll{animation:none}.tile,.bar i{transition:none}}
.conn{background:var(--bad);color:#fff;text-align:center;border-radius:12px;padding:6px;margin-bottom:8px;font-weight:600}
ul{padding-left:1.2em;margin:6px 0 10px}li{margin-bottom:5px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const EM=['🦊','🐼','🐸','🦁','🐙','🦄','🐯','🐵','🐧','🦉','🐢','🐬','🦋','🐨','🐰'];
const TR=[{e:'🎁',n:'Caixa Misteriosa'},{e:'♾️',n:'Casa Sem Fim'},{e:'👤',n:'Casa do Estranho'},{e:'👁️',n:'Olho que Vigia'}];
const DIE=['⚀','⚁','⚂','⚃','⚄','⚅'];
const RULES={
0:{t:'Mostrar o que você realmente ganha',d:'Nada de sorteio pago nem prêmio escondido.',p:'O jogo não pode te enganar',k:'No ECA Digital, caixas de recompensa são proibidas em jogos acessíveis a crianças e adolescentes.'},
1:{t:'Todo jogo tem botão de parar',d:'Sem recompensa por não largar e sem aviso de madrugada.',p:'O jogo não pode te prender',k:'O ECA Digital quer jogos que cuidem de você, em vez de prender você.'},
2:{t:'Só fala comigo quem eu aceitar',d:'Perfil fechado desde o começo e família por perto.',p:'A proteção já vem de fábrica',k:'O ECA Digital prevê proteção por padrão e ferramentas de supervisão da família.'},
3:{t:'O jogo guarda só o que precisa',d:'E não usa o que você faz para te vender coisas.',p:'Você não é o produto',k:'O ECA Digital limita o uso de dados e a publicidade dirigida a menores.'},
10:{t:'Quem for mais rápido escolhe primeiro',d:'Vantagem para quem está na frente.',n:'Isso favorece quem já tinha vantagem e deixa alguém para trás. As armadilhas continuam iguais.'},
11:{t:'Pintar a trilha de outras cores',d:'Fica bonito!',n:'Bonito, mas não protege ninguém. As armadilhas continuam lá.'},
12:{t:'Quem fizer mais pontos ganha troféu',d:'Mais competição!',n:'Troféu não desarma armadilha e ainda deixa o jogo mais competitivo.'},
13:{t:'Quem está na frente ganha um bônus',d:'Prêmio para quem lidera.',n:'Quem já estava bem não precisava de ajuda, e quem caiu continua caindo. Nada mudou nas armadilhas.'},
14:{t:'Efeitos de som em todas as casas',d:'Mais emoção!',n:'Mais barulho, mesma armadilha. Nada protege os jogadores.'}};
const SAY=['Ha ha! Aqui as regras são minhas. Ninguém passa!','Hmm... alguma coisa mudou. Mas ainda tenho truques!','Ei! Vocês estão me deixando mais fraco...','Só me resta uma armadilha. Será que vocês descobrem?','Tá bom, tá bom. Agora o jogo está justo. Podem passar.'];
const HOST=location.hash==='#professor';
const app=document.getElementById('app');
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}};
let tok=ss('trilha_t');if(!tok){tok=Math.random().toString(36).slice(2)+Date.now().toString(36);ss('trilha_t',tok)}
let myAv=ss('trilha_av'),pin=ss('trilha_pin'),S=null,off=false,err='',lastKey='',revealed=true,myVote=-1,voteKey='';
if(HOST&&!pin){pin=prompt('Senha do professor:')||'';ss('trilha_pin',pin)}
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.status).catch(()=>0);

const es=new EventSource('/events');
es.onmessage=e=>{S=JSON.parse(e.data);off=false;if(!HOST&&myAv&&!S.players.some(p=>p.av===myAv)&&!rejoining){rejoining=true;post('/join',{t:tok,av:myAv}).then(s=>{if(s!==200){myAv=null;ss('trilha_av',null)}rejoining=false})}render()};
es.onerror=()=>{off=true;render()};
let rejoining=false;

function sync(){
 const k=S.last?JSON.stringify(S.last)+':'+S.round:'';
 if(k!==lastKey){lastKey=k;if(S.last){revealed=false;setTimeout(()=>{revealed=true;render()},1100)}else revealed=true}
 const vk=S.round+':'+S.cards.join(',');
 if(S.phase==='vote'&&vk!==voteKey){voteKey=vk;myVote=-1}
}
function dpos(p){
 const L=S.last;
 if(S.wait&&L&&L.av===p.av){if(!revealed)return L.from;return L.fell?L.at:p.pos}
 return p.pos;
}
function trail(){
 const n=S.fin,L=S.last,landed=(S.wait&&revealed&&L)?L.at:-1;let h='';
 for(let i=0;i<=n;i++){
  const row=Math.floor(i/10),col=row%2?9-(i%10):i%10,t=S.tp[i];
  const ic=i===0?'🚪':i===n?'🏁':t!==undefined?(S.off[t]?'🛡️':TR[t].e):'';
  const cls='tile'+(t!==undefined?' trap'+(S.off[t]?' off':''):'')+(i===n?' fin':'')+(i===landed?' hit':'');
  const here=S.players.filter(p=>dpos(p)===i).map(p=>`<span class="${p.av===myAv?'me':''}">${p.av}</span>`).join('');
  h+=`<div class="${cls}" style="grid-row:${row+1};grid-column:${col+1}"><span class="nm">${i===0||i===n?'':i}</span><span class="ic">${ic}</span><div class="tok">${here}</div></div>`;
 }
 const lg=TR.map((t,i)=>S.off[i]?`<span>🛡️ <s>${t.n}</s></span>`:`<span>${t.e} ${t.n}</span>`).join('');
 return `<div class="trail">${h}</div><div class="legend">${lg}</div>`;
}
function head(){
 const o=S.off.filter(Boolean).length;
 return `${off?'<div class="conn">Sem conexão. Tentando de novo...</div>':''}<div class="top"><span>Atravessem a Trilha</span><span>${S.phase==='lobby'?'Esperando os jogadores':'Rodada '+S.round+' de '+S.max}</span><span>${S.players.length} jogador${S.players.length==1?'':'es'}</span></div>
 <div class="jogo"><div class="bot" aria-hidden="true">🤖</div><div class="bub"><b>O Jogo:</b> ${SAY[o]}</div></div>`;
}
function chips(){
 return `<div class="chips">${S.players.map(p=>`<div class="chip ${p.av===S.cur&&S.phase==='turns'?'cur':''} ${p.fin?'fin':''}"><span class="e">${p.av}</span>${p.fin?'🏁':'casa '+p.pos}</div>`).join('')}</div>`;
}
function dicePanel(){
 const L=S.last;if(!L||S.phase!=='turns')return '';
 if(!revealed)return `<div class="card dice"><div class="roll" aria-hidden="true">🎲</div><p><b>${L.av}</b> está rolando o dado...</p></div>`;
 const msg=L.fell?`Caiu na ${TR[L.trap].n}! ${L.av} volta para o início.`:L.fin?`${L.av} chegou ao final! 🏁`:`Casa segura. ${L.av} segue em frente.`;
 const rig=L.rig?`<p><b>🤖 O Jogo mexeu no dado!</b> Ele puxou ${L.av} direto para a armadilha.</p>`:'';
 return `<div class="card dice ${L.fell?'no':'ok'}"><div class="die" aria-label="Dado: ${L.v}">${DIE[L.v-1]}</div><h2>${L.av} tirou ${L.v}</h2>${rig}<p>${msg}</p></div>`;
}
function ruleCard(id,i,extra,click){
 const r=RULES[id];
 return `<${click?'button':'div'} class="rule ${i===myVote&&click?'sel':''}" ${click?`onclick="vote(${i})"`:''}><b>${r.t}</b>${r.d}${extra||''}</${click?'button':'div'}>`;
}
function resultPanel(){
 const id=S.res,r=RULES[id];
 if(id<10)return `<div class="card ok"><h2>✅ Regra aprovada: ${r.t}</h2><p><b>${r.p}.</b> A ${TR[id].n} foi desarmada. 🛡️ Todas as casas dela ficaram seguras.</p></div>`;
 return `<div class="card no"><h2>🤔 Regra aprovada: ${r.t}</h2><p>${r.n}</p></div>`;
}
function endPanel(){
 if(S.phase==='win')return `<div class="card ok"><h2>🎉 Todos chegaram ao final, juntos!</h2><p><b>As regras que vocês criaram:</b></p><ul>${S.adopted.map(i=>`<li><b>${RULES[i].p}.</b> ${RULES[i].k}</li>`).join('')}</ul><p>Essas regras existem de verdade. É o <b>ECA Digital</b> (Lei 15.211/2025): uma lei que obriga quem cria jogos e redes a proteger crianças e adolescentes, sem tirar o direito de jogar e de usar a internet. A lei não está contra vocês. Ela está do lado de vocês.</p><p class="mut"><b>Para conversar:</b> qual regra mudou mais o jogo? Por que as regras que não ajudaram não funcionaram? Vocês já viram alguma dessas armadilhas num jogo de verdade?</p></div>`;
 return `<div class="card no"><h2>O Jogo venceu desta vez</h2><p>Nem todos chegaram ao final a tempo. Mas as regras que vocês criaram continuam valendo. Conversem: o que faltou? Que regra faria mais diferença?</p></div>`;
}
function vote(i){myVote=i;post('/vote',{t:tok,c:i});render()}
function join(av){post('/join',{t:tok,av}).then(s=>{if(s===200){myAv=av;ss('trilha_av',av);err=''}else err=s===409?'Esse personagem já foi escolhido. Escolha outro.':'Não deu para entrar. Avise o professor.';render()})}
function roll(){post('/roll',{t:tok})}

function player(){
 const joined=myAv&&S.players.some(p=>p.av===myAv);
 let h=head();
 if(!joined){
  const taken=S.players.map(p=>p.av);
  return h+`<div class="card"><h1>Escolha seu personagem</h1><p class="mut">Vocês precisam chegar <b>juntos</b> ao final da trilha. O Jogo vai tentar impedir. Não precisa digitar nome.</p>${err?`<p><b>${err}</b></p>`:''}<div class="av-pick">${EM.map(e=>`<button ${taken.includes(e)?'disabled':''} onclick="join('${e}')" aria-label="Personagem ${e}">${e}</button>`).join('')}</div></div>`;
 }
 const ph=S.phase;
 h+=`<div class="chips"><div class="chip cur"><span class="e">${myAv}</span>Você</div></div>`;
 h+=trail();
 if(ph==='lobby')h+=`<div class="card"><h2>Você está dentro, ${myAv}!</h2><p>Esperando o professor começar o jogo.</p></div>`+chips();
 else if(ph==='turns'){
  const mine=S.cur===myAv;
  if(mine&&!S.wait)h+=`<div class="card ok"><h2>É a sua vez!</h2><div class="act"><button class="btn big" onclick="roll()">🎲 Rolar meu dado</button></div></div>`;
  else if(!S.wait||!S.last)h+=`<div class="card"><h2>Vez de ${S.cur||'...'}</h2><p class="mut">Torça pelo seu grupo. Todos precisam chegar.</p></div>`;
  h+=dicePanel()+chips();
 }
 else if(ph==='discuss')h+=`<div class="card"><h2>Hora de conversar!</h2><p>${S.fells?`Nesta rodada, <b>${S.fells}</b> jogada${S.fells>1?'s caíram':' caiu'} em armadilhas.`:'Ninguém caiu nesta rodada.'} Conversem em grupo: <b>o que o Jogo fez de injusto com vocês?</b> Que regra poderia deixar o jogo mais justo?</p></div>`+chips();
 else if(ph==='vote'){
  h+=`<div class="card"><h2>Votem na regra!</h2><p class="mut">${myVote<0?'Escolha uma regra. A mais votada vale para todos.':'Voto registrado. Você pode trocar até o professor encerrar.'}</p><div class="grid">${S.cards.map((id,i)=>ruleCard(id,i,'',true)).join('')}</div></div>`;
 }
 else if(ph==='result')h+=resultPanel()+`<p class="act mut">Aguardem o professor começar a próxima rodada.</p>`;
 else h+=endPanel();
 return h;
}
function H(a){
 if(a==='reset'&&!confirm('Reiniciar tudo? Os alunos terão que escolher personagem de novo.'))return;
 post('/host',{pin,a}).then(s=>{if(s===401){ss('trilha_pin',null);pin=prompt('Senha incorreta. Digite de novo:')||'';ss('trilha_pin',pin)}})
}
function host(){
 const ph=S.phase,B=(a,l,c)=>`<button class="${c||'btn big'}" onclick="H('${a}')">${l}</button>`;
 let h=head();
 if(ph==='lobby'){
  h+=`<div class="card"><h2>Alunos: abram <b>${location.origin}</b> e escolham um personagem</h2><p class="mut">Quando todos aparecerem aqui, comece o jogo.</p>${chips()}<div class="act">${B('start','Começar o jogo').replace('class="btn big"',`class="btn big" ${S.players.length?'':'disabled'}`)}</div></div>`;
  return h+`<div class="act">${B('reset','Reiniciar','ghost')}</div>`;
 }
 h+=trail()+chips();
 if(ph==='turns')h+=dicePanel()+(S.wait?'':`<div class="card"><h2>Vez de ${S.cur||'...'}</h2></div>`)+`<div class="act">${B('skip','Pular a vez de quem está jogando','ghost')}</div>`;
 else if(ph==='discuss')h+=`<div class="card"><h2>Hora de conversar!</h2><p>${S.fells?`<b>${S.fells}</b> jogada${S.fells>1?'s caíram':' caiu'} em armadilhas nesta rodada.`:'Ninguém caiu nesta rodada.'} O que o Jogo fez de injusto? Que regra deixaria o jogo mais justo?</p><div class="act">${B('vote','Abrir a votação')}</div></div>`;
 else if(ph==='vote')h+=`<div class="card"><h2>Votação: ${S.nv} de ${S.players.length} votaram</h2><div class="grid">${S.cards.map((id,i)=>ruleCard(id,i,`<div class="bar"><i style="width:${S.players.length?S.counts[i]/S.players.length*100:0}%"></i></div><small>${S.counts[i]} voto${S.counts[i]==1?'':'s'}</small>`,false)).join('')}</div><div class="act">${B('close','Encerrar a votação')}</div></div>`;
 else if(ph==='result')h+=resultPanel()+`<div class="act">${B('next','Próxima rodada')}</div>`;
 else h+=endPanel()+(ph==='lose'?`<div class="act">${B('again','Tentar de novo com as regras criadas')}</div>`:'');
 return h+`<div class="act">${B('reset','Reiniciar tudo','ghost')}</div>`;
}
function render(){
 if(!S){app.innerHTML='<p class="card">Conectando ao jogo...</p>';return}
 sync();app.innerHTML=HOST?host():player();
}
render();
</script>
</body>
</html>
