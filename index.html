<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atravessem a Trilha</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f0ff;--card:#fff;--tx:#1d1b4b;--mut:#5d5a8c;--ln:#d6d1f7;--bad:#d93a24;--good:#0e9a72;--acc:#5a3fe0;--hl:#ffd23f}
@media (prefers-color-scheme:dark){:root{--bg:#16143a;--card:#221f55;--tx:#f2f0ff;--mut:#aaa6dc;--ln:#3a3680;--bad:#ff6b57;--good:#3ddba7;--acc:#8d7bff}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Fredoka',system-ui,sans-serif;font-size:clamp(16px,1.4vw,21px);line-height:1.4}
main{max-width:1240px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:clamp(28px,4.5vw,48px);margin:0 0 6px;line-height:1.05}
h2{font-size:clamp(20px,2.3vw,28px);margin:0 0 8px;line-height:1.15}
p{margin:0 0 10px;max-width:72ch}
.mut{color:var(--mut)}
.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:14px 18px;margin-top:12px}
.card.ok{border-color:var(--good)}.card.no{border-color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap}
.jogo{display:flex;align-items:center;gap:12px;margin-top:8px}
.bot{font-size:clamp(38px,5vw,60px);line-height:1}
.bub{background:var(--card);border:2px solid var(--bad);border-radius:18px 18px 18px 4px;padding:8px 14px;font-weight:500}
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px;align-items:start;margin-top:10px}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.stage .card:first-child{margin-top:0}
.trailwrap{max-width:820px;margin:10px auto 0}
.trail{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tile{min-height:clamp(78px,9.5vw,128px);border-radius:16px;border:3px solid var(--ln);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;position:relative;transition:background .3s,border-color .3s}
.tile .ic{font-size:clamp(22px,3vw,38px);line-height:1}
.tile small{font-size:clamp(11px,1.05vw,14px);font-weight:600;text-align:center;line-height:1.1;color:var(--mut)}
.tile .nm{position:absolute;top:3px;left:8px;font-size:11px;color:var(--mut);font-weight:600}
.tile.trap{border-color:var(--bad)}
.tile.trap.off{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.tile.fin{border-color:var(--acc)}
.tile.hit{background:var(--hl);color:#1d1b4b}
.tile.hit small{color:#1d1b4b}
.tile.hit.bad{background:var(--bad);color:#fff}.tile.hit.bad small{color:#fff}
.tile.hit.good{background:var(--good);color:#fff}.tile.hit.good small{color:#fff}
.tok{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;font-size:clamp(16px,2vw,26px);line-height:1.05}
.tok span.me{outline:3px solid var(--acc);border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-weight:500;font-size:.9em}
.legend s{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{border:3px solid var(--ln);border-radius:999px;padding:2px 12px 2px 6px;background:var(--card);font-weight:600;display:flex;align-items:center;gap:6px;font-size:.9em}
.chip .e{font-size:1.5em}
.chip.cur{border-color:var(--hl);background:color-mix(in srgb,var(--hl) 40%,var(--card));transform:scale(1.06)}
.chip.fin{border-color:var(--good)}
button{font:inherit;font-weight:600;border-radius:14px;border:3px solid var(--acc);padding:10px 20px;cursor:pointer;color:var(--tx);background:var(--card)}
.btn{background:var(--acc);color:#fff}
.btn.big{font-size:1.2em;padding:13px 26px}
.btn:disabled,button:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent}
:focus-visible{outline:4px solid var(--hl);outline-offset:2px}
.act{text-align:center;margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:10px}
.rule{text-align:left;border:3px solid var(--ln);border-radius:16px;padding:12px 14px;font-weight:500;font-size:.95em}
.rule b{display:block;font-size:1.08em;margin-bottom:3px}
.rule.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.bar{height:14px;border-radius:7px;background:var(--ln);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.av-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin-top:10px}
.av-pick button{font-size:2.2em;padding:8px;border-radius:18px}
.ev{text-align:center}
.ev.no{background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.ev.ok{background:color-mix(in srgb,var(--good) 13%,var(--card))}
.ev.pop{animation:pop .35s}
.ev p{margin-left:auto;margin-right:auto;font-size:1.08em}
.die{font-size:clamp(70px,9vw,110px);line-height:1}
.roll{font-size:clamp(70px,9vw,110px);line-height:1;animation:sh .35s infinite}
@keyframes sh{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes pop{0%{transform:scale(.88);opacity:.3}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.roll,.ev.pop{animation:none}.tile,.bar i,.hist i{transition:none}}
.log{list-style:none;padding:0;margin:8px 0 0}
.log li{padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--ln) 35%,var(--card));margin-bottom:5px;font-size:.9em}
.log li.fall{background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.log li.protected,.log li.fin{background:color-mix(in srgb,var(--good) 14%,var(--card))}
.hist{display:flex;gap:10px;align-items:flex-end;margin:10px 0;max-width:520px}
.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-weight:600;height:150px}
.hist i{display:block;width:70%;background:var(--acc);border-radius:8px 8px 0 0;min-height:3px;transition:height .4s}
.hist .face{font-size:1.8em;line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.tag{border:2px solid var(--bad);border-radius:999px;padding:2px 12px;font-weight:600;background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.conn{background:var(--bad);color:#fff;text-align:center;border-radius:12px;padding:6px;margin-bottom:8px;font-weight:600}
ul{padding-left:1.2em;margin:6px 0 10px}li{margin-bottom:5px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const EM=['🦊','🐼','🐸','🦁','🐙','🦄','🐯','🐵','🐧','🦉','🐢','🐬','🦋','🐨','🐰'];
const PROBS=[{e:'🎁',n:'Caixa Misteriosa'},{e:'♾️',n:'Casa Sem Fim'},{e:'👤',n:'Casa do Estranho'},{e:'🎲',n:'Dado viciado'}];
const DIE=['⚀','⚁','⚂','⚃','⚄','⚅'];
const STORY=['Você pagou para abrir uma caixa sem saber o que vinha dentro. Só veio azar.','A rolagem não acabava e o botão de sair estava escondido. Você ficou preso.','Alguém desconhecido puxou conversa e pediu informações suas. Você se afastou do grupo.'];
const FIX=['A caixa agora mostra o prêmio antes de abrir. Sem surpresa.','O botão de parar apareceu e funciona. Você sai quando quiser.','O perfil já vem fechado. Só fala com você quem você aceitar.'];
const RULES={
0:{t:'Fim das caixas-surpresa pagas',d:'O jogo mostra o que você ganha. Sem sorteio escondido.',p:'Sem sorteio pago para menores',prob:'Na Caixa Misteriosa você pagava sem saber o que vinha, e quase sempre perdia.',after:'A Caixa Misteriosa virou casa segura: o prêmio aparece antes de abrir.',k:'No ECA Digital, caixas de recompensa são proibidas em jogos acessíveis a crianças e adolescentes. Elas funcionam como um jogo de azar digital.'},
1:{t:'Botão de parar sempre à vista',d:'Sem recompensa por não largar. Você sai quando quiser.',p:'O jogo não pode te prender',prob:'A Casa Sem Fim te prendia e escondia a saída.',after:'A Casa Sem Fim virou casa segura: o botão de parar aparece e funciona.',k:'A lei pede proteção prioritária de quem está em desenvolvimento em todo o ambiente digital. Um jogo que prende o jogador vai contra isso.'},
2:{t:'Perfil fechado desde o começo',d:'Só fala comigo quem eu aceitar, e o jogo não pede dados demais.',p:'A proteção já vem de fábrica',prob:'O Estranho conseguia falar com você e pedir informações.',after:'A Casa do Estranho virou casa segura: o perfil já vem fechado.',k:'O ECA Digital prevê proteção por padrão, ferramentas de supervisão da família e regras para o uso de dados e para a publicidade dirigida a menores.'},
3:{t:'Dado honesto para todo mundo',d:'Ninguém mexe no resultado. O sorteio é de verdade.',p:'O jogo tem que ser justo e claro',prob:'O Jogo mexia no dado para empurrar vocês para as armadilhas.',after:'O dado agora é sorteado de verdade: cada jogador pode tirar um número diferente.',k:'Quem cria o jogo não pode enganar quem joga. É o mesmo cuidado por trás da proibição das caixas de recompensa no ECA Digital.'},
10:{t:'Quem for mais rápido escolhe primeiro',d:'Vantagem para quem está na frente.',n:'Isso favorece quem já estava na frente e deixa alguém para trás. O dado e as armadilhas continuam iguais.'},
11:{t:'Pintar a trilha de outras cores',d:'Fica bonito!',n:'Ficou bonito, mas o dado e as armadilhas continuam iguais.'},
12:{t:'Quem fizer mais pontos ganha troféu',d:'Mais competição!',n:'Troféu não desarma armadilha e deixa o jogo mais competitivo. O dado continua igual.'},
13:{t:'Quem está na frente ganha um bônus',d:'Prêmio para quem lidera.',n:'Quem já estava bem não precisava de ajuda, e quem caiu continua caindo. Nada mudou no dado nem nas armadilhas.'},
14:{t:'Efeitos de som em todas as casas',d:'Mais emoção!',n:'Mais barulho, mesma armadilha. Nada protege os jogadores.'}};
const SAY=['Ha ha! Aqui as regras são minhas. Ninguém passa!','Hmm... alguma coisa mudou. Mas ainda tenho truques!','Ei! Vocês estão me deixando mais fraco...','Só me resta um truque. Será que vocês descobrem?','Tá bom, tá bom. Agora o jogo está justo. Podem passar.'];
const COLS=6,HOST=location.hash==='#professor';
const app=document.getElementById('app');
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}};
let tok=ss('trilha_t');if(!tok){tok=Math.random().toString(36).slice(2)+Date.now().toString(36);ss('trilha_t',tok)}
let myAv=ss('trilha_av'),pin=ss('trilha_pin'),S=null,off=false,err='',lastKey=-1,revealed=true,myVote=-1,voteKey='',rejoining=false;
if(HOST&&!pin){pin=prompt('Senha do professor:')||'';ss('trilha_pin',pin)}
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.status).catch(()=>0);

const es=new EventSource('/events');
es.onmessage=e=>{S=JSON.parse(e.data);off=false;
 if(!HOST&&myAv&&!S.players.some(p=>p.av===myAv)&&!rejoining){rejoining=true;post('/join',{t:tok,av:myAv}).then(s=>{if(s!==200){myAv=null;ss('trilha_av',null)}rejoining=false})}
 render()};
es.onerror=()=>{off=true;render()};

function sync(){
 const k=S.last?S.last.n:0;
 if(k!==lastKey){lastKey=k;if(S.last){revealed=false;setTimeout(()=>{revealed=true;render()},1100)}else revealed=true}
 const vk=S.round+':'+S.cards.join(',');
 if(S.phase==='vote'&&vk!==voteKey){voteKey=vk;myVote=-1}
}
function dpos(p){
 const L=S.last;
 if(S.wait&&L&&L.av===p.av){if(!revealed)return L.from;return L.kind==='fall'?L.at:p.pos}
 return p.pos;
}
function trailHTML(){
 const n=S.fin,L=S.last,show=S.wait&&revealed&&L;let h='';
 for(let i=0;i<=n;i++){
  const row=Math.floor(i/COLS),col=row%2?COLS-1-(i%COLS):i%COLS,t=S.tp[i];
  const isoff=t!==undefined&&S.off[t];
  const ic=i===0?'🚪':i===n?'🏁':t!==undefined?(isoff?'🛡️':PROBS[t].e):'';
  const lb=i===0?'Início':i===n?'Final':t!==undefined?(isoff?'Casa segura':PROBS[t].n):'';
  let cls='tile'+(t!==undefined?' trap'+(isoff?' off':''):'')+(i===n?' fin':'');
  if(show&&L.at===i)cls+=' hit'+(L.kind==='fall'?' bad':(L.kind==='protected'||L.kind==='fin')?' good':'');
  const here=S.players.filter(p=>dpos(p)===i).map(p=>`<span class="${p.av===myAv?'me':''}">${p.av}</span>`).join('');
  h+=`<div class="${cls}" style="grid-row:${row+1};grid-column:${col+1}"><span class="nm">${i===0||i===n?'':i}</span><span class="ic">${ic}</span><small>${lb}</small><div class="tok">${here}</div></div>`;
 }
 const lg=PROBS.map((t,i)=>S.off[i]?`<span>🛡️ <s>${t.n}</s></span>`:`<span>${t.e} ${t.n}</span>`).join('');
 return `<div class="trail">${h}</div><div class="legend">${lg}</div>`;
}
function head(){
 const o=S.off.filter(Boolean).length;
 return `${off?'<div class="conn">Sem conexão. Tentando de novo...</div>':''}<div class="top"><span>Atravessem a Trilha</span><span>${S.phase==='lobby'?'Esperando os jogadores':'Rodada '+S.round+' de '+S.max}</span><span>${S.players.length} jogador${S.players.length==1?'':'es'}</span></div>
 <div class="jogo"><div class="bot" aria-hidden="true">🤖</div><div class="bub"><b>O Jogo:</b> ${SAY[o]}</div></div>`;
}
function chips(){
 return `<div class="chips">${S.players.map(p=>`<div class="chip ${p.av===S.cur&&S.phase==='turns'?'cur':''} ${p.fin?'fin':''}"><span class="e">${p.av}</span>${p.fin?'🏁':'casa '+p.pos}</div>`).join('')}</div>`;
}
function eventCard(){
 const L=S.last;if(!L||S.phase!=='turns')return '';
 if(!revealed)return `<div class="card ev"><div class="roll" aria-hidden="true">🎲</div><p><b>${L.av}</b> está rolando o dado...</p></div>`;
 let cls='',title=`${L.av} tirou ${L.v}`,text='Casa segura. Segue em frente.';
 if(L.kind==='fall'){cls='no';title=`${L.av} caiu na ${PROBS[L.trap].n}!`;text=STORY[L.trap]+' <b>Volta para o início.</b>'}
 else if(L.kind==='protected'){cls='ok';title=`${L.av} passou pela ${PROBS[L.trap].n}`;text='🛡️ <b>Regra em ação:</b> '+FIX[L.trap]}
 else if(L.kind==='fin'){cls='ok';title=`🏁 ${L.av} chegou ao final!`;text='Falta o resto da turma chegar também.'}
 const honesto=S.off[3]?'<small class="mut">🎲 Dado honesto: sorteio de verdade</small>':'';
 return `<div class="card ev pop ${cls}"><div class="die" aria-label="Dado: ${L.v}">${DIE[L.v-1]}</div>${honesto}<h2>${title}</h2><p>${text}</p>${L.auto?'<p class="mut"><small>O dado rolou sozinho porque a vez demorou.</small></p>':''}</div>`;
}
function logHTML(n){
 if(!S.log.length)return '';
 const rows=S.log.slice(0,n).map(e=>{
  let t='casa segura';
  if(e.kind==='fall')t=`${PROBS[e.trap].e} caiu na ${PROBS[e.trap].n}, volta ao início`;
  else if(e.kind==='protected')t=`🛡️ passou pela ${PROBS[e.trap].n} (regra em ação)`;
  else if(e.kind==='fin')t='🏁 chegou ao final';
  return `<li class="${e.kind}">${e.av} ${DIE[e.v-1]} ${e.v}: ${t}</li>`}).join('');
 return `<div class="card"><h2>Diário da rodada</h2><ul class="log">${rows}</ul></div>`;
}
function report(){
 const mx=Math.max(1,...S.hist);
 const hist=`<div class="hist" role="img" aria-label="Quantas vezes saiu cada número do dado">${S.hist.map((c,i)=>`<div><span>${c}</span><i style="height:${Math.round(c/mx*90)}px"></i><span class="face">${DIE[i]}</span></div>`).join('')}</div>`;
 const fb=S.fallBy.map((c,i)=>c?`<span class="tag">${PROBS[i].e} ${PROBS[i].n}: ${c}</span>`:'').join('');
 return `<div class="card"><h2>O que aconteceu nesta rodada</h2><div class="cols"><div><p><b>Números que saíram nos dados:</b></p>${hist}</div><div><p><b>${S.fells?S.fells+' queda'+(S.fells>1?'s':'')+', por causa de:':'Ninguém caiu.'}</b></p><div class="tags">${fb}</div><p class="mut">Para conversar:</p><ul><li>Os números dos dados parecem sorteados de verdade?</li><li>Como cada armadilha pegou vocês?</li><li>Que regra deixaria o jogo mais justo sem acabar com a diversão?</li></ul></div></div></div>`+logHTML(99);
}
function ruleCard(id,i,extra,click){
 const r=RULES[id],tag=click?'button':'div';
 return `<${tag} class="rule ${i===myVote&&click?'sel':''}" ${click?`onclick="vote(${i})"`:''}><b>${r.t}</b>${r.d}${extra||''}</${tag}>`;
}
function resultPanel(){
 const id=S.res,r=RULES[id];
 if(id<10)return `<div class="card ok"><h2>✅ Regra aprovada: ${r.t}</h2><p><b>O problema:</b> ${r.prob}</p><p><b>O que muda no jogo:</b> ${r.after}</p><p class="mut">Princípio: ${r.p}.</p></div>`;
 return `<div class="card no"><h2>🤔 Regra aprovada: ${r.t}</h2><p>${r.n}</p><p class="mut">Os problemas continuam. Na próxima rodada, vocês podem escolher de novo.</p></div>`;
}
function endPanel(){
 if(S.phase==='win')return `<div class="card ok"><h2>🎉 Todos chegaram ao final, juntos!</h2><p><b>As regras que vocês criaram:</b></p><ul>${S.adopted.map(i=>`<li><b>${RULES[i].p}.</b> ${RULES[i].prob} ${RULES[i].k}</li>`).join('')}</ul><p>Essas regras existem de verdade. É o <b>ECA Digital</b> (Lei 15.211/2025): uma lei que obriga quem cria jogos e redes a proteger crianças e adolescentes, sem tirar o direito de jogar e de usar a internet. A lei não está contra vocês. Ela está do lado de vocês.</p><p class="mut"><b>Para conversar:</b> qual regra mudou mais o jogo? Por que as regras que não ajudaram não funcionaram? Vocês já viram alguma dessas armadilhas num jogo de verdade?</p></div>`;
 return `<div class="card no"><h2>O Jogo venceu desta vez</h2><p>Nem todos chegaram ao final a tempo. Mas as regras que vocês criaram continuam valendo. Conversem: o que faltou? Que regra faria mais diferença?</p></div>`;
}
function vote(i){myVote=i;post('/vote',{t:tok,c:i});render()}
function join(av){post('/join',{t:tok,av}).then(s=>{if(s===200){myAv=av;ss('trilha_av',av);err=''}else err=s===409?'Esse personagem já foi escolhido. Escolha outro.':'Não deu para entrar. Avise o professor.';render()})}
function roll(){post('/roll',{t:tok})}
const stage=(l,r)=>`<div class="stage"><div class="card">${l}${chips()}</div><div>${r}</div></div>`;
const solo=()=>`<div class="trailwrap">${trailHTML()}</div>`+chips();

function player(){
 const joined=myAv&&S.players.some(p=>p.av===myAv);
 let h=head();
 if(!joined){
  const taken=S.players.map(p=>p.av);
  return h+`<div class="card"><h1>Escolha seu personagem</h1><p class="mut">Vocês precisam chegar <b>juntos</b> ao final da trilha. O Jogo vai tentar impedir. Não precisa digitar nome.</p>${err?`<p><b>${err}</b></p>`:''}<div class="av-pick">${EM.map(e=>`<button ${taken.includes(e)?'disabled':''} onclick="join('${e}')" aria-label="Personagem ${e}">${e}</button>`).join('')}</div></div>`;
 }
 const ph=S.phase;
 if(ph==='turns'){
  const mine=S.cur===myAv;let r='';
  if(mine&&!S.wait)r+=`<div class="card ok ev"><h2>É a sua vez, ${myAv}!</h2><div class="act"><button class="btn big" onclick="roll()">🎲 Rolar meu dado</button></div><p class="mut"><small>Se demorar, o dado rola sozinho.</small></p></div>`;
  else if(!S.wait)r+=`<div class="card ev"><h2>Vez de ${S.cur||'...'}</h2><p class="mut">Torça pelo seu grupo. Todos precisam chegar.</p></div>`;
  r+=eventCard()+logHTML(8);
  return h+stage(trailHTML(),r);
 }
 h+=solo();
 if(ph==='lobby')h+=`<div class="card"><h2>Você está dentro, ${myAv}!</h2><p>Esperando o professor começar o jogo.</p></div>`;
 else if(ph==='discuss')h+=`<div class="card"><h2>Hora de conversar!</h2><p>Olhem o relatório abaixo e conversem em grupo antes da votação.</p></div>`+report();
 else if(ph==='vote')h+=`<div class="card"><h2>Votem na regra!</h2><p class="mut">${myVote<0?'Escolha uma regra. A mais votada vale para todos.':'Voto registrado. Você pode trocar até o professor encerrar.'}</p><div class="grid">${S.cards.map((id,i)=>ruleCard(id,i,'',true)).join('')}</div></div>`;
 else if(ph==='result')h+=resultPanel()+`<p class="act mut">Aguardem o professor começar a próxima rodada.</p>`;
 else h+=endPanel();
 return h;
}
function H(a){
 if(a==='reset'&&!confirm('Reiniciar tudo? Os alunos terão que escolher personagem de novo.'))return;
 post('/host',{pin,a}).then(s=>{if(s===401){ss('trilha_pin',null);pin=prompt('Senha incorreta. Digite de novo:')||'';ss('trilha_pin',pin)}})
}
function host(){
 const ph=S.phase,B=(a,l,c)=>`<button class="${c||'btn big'}" onclick="H('${a}')">${l}</button>`;
 let h=head();
 if(ph==='lobby'){
  h+=`<div class="card"><h2>Alunos: abram <b>${location.origin}</b> e escolham um personagem</h2><p class="mut">Quando todos aparecerem aqui, comece o jogo.</p>${chips()}<div class="act">${B('start','Começar o jogo').replace('class="btn big"',`class="btn big" ${S.players.length?'':'disabled'}`)}</div></div>`;
  return h+`<div class="act">${B('reset','Reiniciar','ghost')}</div>`;
 }
 if(ph==='turns'){
  let r=eventCard();
  if(!S.wait)r+=`<div class="card ev"><h2>Vez de ${S.cur||'...'}</h2><p class="mut">Esperando a jogada.</p></div>`;
  r+=logHTML(8)+`<div class="act">${B('skip','Pular a vez','ghost')}</div>`;
  h+=stage(trailHTML(),r);
 } else {
  h+=solo();
  if(ph==='discuss')h+=`<div class="card"><h2>Hora de conversar!</h2><p>Olhem o relatório e deixem a turma discutir. Quando estiverem prontos, abra a votação.</p><div class="act">${B('vote','Abrir a votação')}</div></div>`+report();
  else if(ph==='vote')h+=`<div class="card"><h2>Votação: ${S.nv} de ${S.players.length} votaram</h2><div class="grid">${S.cards.map((id,i)=>ruleCard(id,i,`<div class="bar"><i style="width:${S.players.length?S.counts[i]/S.players.length*100:0}%"></i></div><small>${S.counts[i]} voto${S.counts[i]==1?'':'s'}</small>`,false)).join('')}</div><div class="act">${B('close','Encerrar a votação')}</div></div>`;
  else if(ph==='result')h+=resultPanel()+`<div class="act">${B('next','Próxima rodada')}</div>`;
  else h+=endPanel()+(ph==='lose'?`<div class="act">${B('again','Tentar de novo com as regras criadas')}</div>`:'');
 }
 return h+`<div class="act">${B('reset','Reiniciar tudo','ghost')}</div>`;
}
function render(){
 if(!S){app.innerHTML='<p class="card">Conectando ao jogo...</p>';return}
 sync();app.innerHTML=HOST?host():player();
}
render();
</script>
