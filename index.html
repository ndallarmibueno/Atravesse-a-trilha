<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atravessem a Trilha</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f0ff;--card:#fff;--tx:#1d1b4b;--mut:#5d5a8c;--ln:#d6d1f7;--bad:#d93a24;--good:#0e9a72;--acc:#5a3fe0;--hl:#ffd23f}
@media (prefers-color-scheme:dark){:root{--bg:#16143a;--card:#221f55;--tx:#f2f0ff;--mut:#aaa6dc;--ln:#3a3680;--bad:#ff6b57;--good:#3ddba7;--acc:#8d7bff}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Fredoka',system-ui,sans-serif;font-size:clamp(16px,1.4vw,20px);line-height:1.4}
main{max-width:1060px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:clamp(28px,4.5vw,46px);margin:0 0 6px;line-height:1.05}
h2{font-size:clamp(20px,2.3vw,28px);margin:0 0 8px;line-height:1.15}
p{margin:0 0 10px;max-width:72ch}
[hidden]{display:none!important}
.mut{color:var(--mut)}
.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:14px 18px;margin-top:12px}
.card.ok{border-color:var(--good)}.card.no{border-color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap}
.conn{background:var(--bad);color:#fff;text-align:center;border-radius:12px;padding:6px;margin-bottom:8px;font-weight:600}
button{font:inherit;font-weight:600;border-radius:14px;border:3px solid var(--acc);padding:10px 20px;cursor:pointer;color:var(--tx);background:var(--card)}
.btn{background:var(--acc);color:#fff}
.btn.big{font-size:1.15em;padding:12px 26px}
.btn:disabled,button:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent}
.warn{border-color:var(--bad);color:var(--bad);background:transparent}
:focus-visible{outline:4px solid var(--hl);outline-offset:2px}
.act{text-align:center;margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cvwrap{margin-top:10px;position:relative}
#cv{width:100%;aspect-ratio:3/1;display:block;border-radius:16px;border:3px solid var(--ln);background:#dfe9ff;touch-action:manipulation;cursor:pointer}
.hint{text-align:center;font-weight:500;margin-top:6px}
.strip{margin-top:10px;background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:6px 14px 4px}
.strip small{color:var(--mut);font-weight:500}
.lane{position:relative;height:70px;margin-top:2px}
.lane::after{content:'🏁';position:absolute;right:-2px;top:0;font-size:20px}
.mate{position:absolute;font-size:22px;line-height:1;transition:left .5s linear}
.mate.hit{animation:hit .6s}
.mate.me i{position:absolute;left:-3px;right:-3px;bottom:-3px;height:3px;background:var(--acc);border-radius:2px}
.mate i{display:none}.mate.me i{display:block}
@keyframes hit{25%{transform:translateY(-8px) rotate(-20deg)}75%{transform:translateY(0) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.mate.hit{animation:none}.mate{transition:none}}
.av-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin-top:10px}
.av-pick button{font-size:2.2em;padding:8px;border-radius:18px}
.big-e{font-size:clamp(46px,7vw,80px);line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.rule{text-align:left;border:3px solid var(--ln);border-radius:16px;padding:12px 14px;font-weight:500;font-size:.95em}
.rule b{display:block;font-size:1.08em;margin-bottom:3px}
.rule.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.rule.win{border-color:var(--good)}
.bar{height:14px;border-radius:7px;background:var(--ln);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.stat{border:2px solid var(--ln);border-radius:12px;padding:4px 12px;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.92em}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln)}
td.e{font-size:1.5em}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:600;font-size:.85em;border:2px solid var(--ln)}
.pill.ok{border-color:var(--good);color:var(--good)}.pill.no{border-color:var(--bad);color:var(--bad)}
ul{padding-left:1.2em;margin:6px 0 10px}li{margin-bottom:5px}

</style>
</head>
<body>
<main>
  <div id="host" hidden></div>
  <div id="app">
    <div id="bar"></div>
    <section id="v-pick" hidden></section>
    <section id="v-game" hidden>
      <div class="cvwrap"><canvas id="cv" width="900" height="300" aria-label="Área do jogo"></canvas></div>
      <p class="hint" id="gtxt"></p>
      <div class="strip"><small>Seus colegas na pista</small><div class="lane" id="lane"></div></div>
    </section>
    <section id="v-report" hidden></section>
    <section id="v-discuss" hidden></section>
    <section id="v-vote" hidden></section>
    <section id="v-result" hidden></section>
    <section id="v-end" hidden></section>
  </div>
</main>
<script>
/* ===== Textos do jogo (truques, regras, lei) ===== */
const EM = ['🦊','🐼','🐸','🦁','🐙','🦄','🐯','🐵','🐧','🦉','🐢','🐬','🦋','🐨','🐰'];
const TRK = [
  { e: '🎁', n: 'O presente que não era presente',
    d: 'Um presente brilhante apareceu no seu caminho. Se você desviava, vinham mais, e depois uma fileira que não dava para pular. O jogo queria que você pegasse o "prêmio" e perdesse.' },
  { e: '📢', n: 'O anúncio que cobria o jogo',
    d: 'Um anúncio tapou a tela justo quando os obstáculos vinham. O botão de fechar era minúsculo e fugia do mouse. O jogo escondeu o que vinha pela frente.' },
  { e: '🐻', n: 'O bicho gigante',
    d: 'Apareceu um obstáculo grande demais para qualquer pulo. Não tinha como passar, por mais que você tentasse. Não era falta de habilidade sua.' },
  { e: '😎', n: 'O "amigo" que não era amigo',
    d: 'Alguém que você não conhece começou a falar com você, fazendo convites tentadores e abrindo portas que não davam para desviar. A corrida não parou, e você não teve como escapar.' },
  { e: '🏁', n: 'A linha que fugia',
    d: 'A linha de chegada ficava sempre um pouco mais à frente. Depois o jogo acelerou e encheu a pista de obstáculos. Ele queria que você nunca parasse, até perder.' }
];
const RULES = {
  0: { t: 'O jogo não pode enganar você', d: 'O que parece prêmio tem que ser prêmio de verdade.',
       k: 'O ECA Digital proíbe as caixas de recompensa em jogos acessíveis a crianças e adolescentes: um sorteio que parece prêmio e é armadilha.' },
  1: { t: 'O jogo não pode atrapalhar quem está jogando', d: 'Nada de interrupções no meio da partida.',
       k: 'O ECA Digital restringe a publicidade dirigida a crianças e adolescentes e quer serviços pensados para o bem-estar de quem usa.' },
  2: { t: 'O jogo tem que ser justo com todo mundo', d: 'Todos precisam ter a mesma chance de vencer.',
       k: 'A lei parte da ideia de que quem cria o produto é responsável por proteger quem é mais vulnerável, e não por explorá-lo.' },
  3: { t: 'O jogo tem que proteger você de quem você não conhece', d: 'Ninguém chega perto de você sem você querer.',
       k: 'O ECA Digital prevê proteção por padrão e ferramentas de supervisão da família, para ninguém chegar a você sem você ou sua família quererem.' },
  4: { t: 'O jogo não pode prender você', d: 'Você pode parar quando quiser, sem perder o que fez.',
       k: 'A lei exige que os serviços priorizem a proteção de quem está em desenvolvimento. Um jogo desenhado para prender vai contra esse princípio.' },
  10: { t: 'Quem for mais rápido escolhe primeiro', d: 'Vantagem para quem já está na frente.', n: 'Isso ajuda quem já ia bem e deixa alguém para trás. Os truques continuam.' },
  11: { t: 'Pintar a pista de outras cores', d: 'Fica bonito!', n: 'Ficou bonito, mas os truques continuam iguais.' },
  12: { t: 'Quem fizer mais pontos ganha troféu', d: 'Mais competição!', n: 'Troféu não protege ninguém e ainda deixa o jogo mais competitivo. Os truques continuam.' },
  13: { t: 'Quem está na frente ganha um bônus', d: 'Prêmio para quem lidera.', n: 'Quem já estava bem não precisava de ajuda, e quem estava preso continua preso. Os truques continuam.' },
  14: { t: 'Efeitos de som em toda a pista', d: 'Mais emoção!', n: 'Mais barulho, mesmos truques. Nada protege os jogadores.' },
  15: { t: 'Deixar o jogo ainda mais rápido', d: 'Mais adrenalina!', n: 'Mais rápido só deixa tudo mais difícil. Os truques continuam.' }
};

/* ===== Truques do Jogo (cada um tem um roteiro que garante a batida) ===== */
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
const Tricks = (() => {
  const MSG = ['Vem comigo, tenho um prêmio!', 'Rápido, só hoje!', 'Aqui é melhor, entra!', 'Confia em mim!'];
  const mk = (a, type, x, w, h, src, extra) => a.spawn(Object.assign({ type, x, w, h, b: 0, src }, extra));
  const gift = (a, x, label) => mk(a, 'gift', x, 36, 36, 'gift', { label });
  const wall = (a, x, src) => mk(a, 'wall', x, 40, 122, src);   // mais alta que qualquer pulo
  const door = (a, x, label) => mk(a, 'door', x, 46, 114, 'friend', { label });

  // ---------- 0: presente que era armadilha ----------
  const GIFT = {
    init(a, L) { L.g = { stage: 0, next: 3, watch: null, forced: false }; },
    update(a, L) {
      const G = L.g, v = a.v();
      if (G.watch && G.watch.x + G.watch.w < L.dist + a.PX - 14) { G.watch = null; G.next = L.t + 0.6; } // desviou: vem mais
      if (G.stage >= 3 || G.watch) return;
      const force = L.t >= 11 && !G.forced && G.stage < 2;
      if (force) { G.stage = 2; G.forced = true; }
      if (L.t < G.next && !force) return;
      const x = a.safeX(120);
      if (G.stage === 0) { G.watch = gift(a, x, true); a.reserve(x + 40); }
      else if (G.stage === 1) { gift(a, x, true); G.watch = gift(a, x + 38); a.reserve(x + 80); }
      else { const n = Math.ceil((v * a.AIR + 170) / 38); for (let i = 0; i < n; i++) gift(a, x + i * 38, i === 0); a.reserve(x + n * 38); }
      G.stage++;
    }
  };

  // ---------- 1: anúncio no meio do jogo ----------
  const newPop = (A, L, k) => {
    const p = { x: 220 - k * 22, y: 48 + k * 9, w: 620, h: 200, born: L.t, bx: { x: 0, y: 0, s: 12 } };
    p.bx.x = p.x + p.w - 22; p.bx.y = p.y + 9; A.pops.push(p);
  };
  const AD = {
    init(a, L) { L.ad = { pops: [], next: 4, n: 0, seq: false }; },
    update(a, L) {
      const A = L.ad, n0 = A.pops.length;
      A.pops = A.pops.filter(p => L.t - p.born < 7);
      if (n0 && !A.pops.length) A.next = L.t + 0.9;
      if (!A.pops.length && L.t >= A.next && A.n < 5) {
        newPop(A, L, 0); A.n++;
        if (!A.seq) { // o que vem pela frente fica escondido atrás do anúncio
          A.seq = true; const v = a.v(), x = a.safeX(130);
          mk(a, 'cactus', x, 26, 44, 'ad'); mk(a, 'bird', x + v * 0.75, 40, 28, 'ad', { b: 34 });
          const w1 = x + v * 1.45; wall(a, w1, 'ad'); wall(a, w1 + v * 0.55, 'ad'); a.reserve(w1 + v * 0.55 + 40);
        }
      }
    },
    draw(a, L) {
      const c = a.ctx;
      for (const p of L.ad.pops) {
        c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 18; c.fillStyle = '#fff'; rr(c, p.x, p.y, p.w, p.h, 14); c.fill(); c.restore();
        c.lineWidth = 4; c.strokeStyle = '#ff3b6b'; rr(c, p.x, p.y, p.w, p.h, 14); c.stroke();
        c.fillStyle = '#ff3b6b'; rr(c, p.x + 2, p.y + 2, p.w - 4, 30, 12); c.fill();
        c.fillStyle = '#fff'; c.font = 'bold 13px sans-serif'; c.textAlign = 'left'; c.fillText('ANÚNCIO', p.x + 14, p.y + 22);
        c.fillStyle = '#1d1b4b'; c.textAlign = 'center'; c.font = 'bold 32px Fredoka, sans-serif'; c.fillText('🎉 PARABÉNS! 🎉', p.x + p.w / 2, p.y + 82);
        c.font = '500 19px Fredoka, sans-serif'; c.fillText('Você é o visitante número 1.000.000!', p.x + p.w / 2, p.y + 114);
        c.fillStyle = '#16a34a'; rr(c, p.x + p.w / 2 - 120, p.y + 134, 240, 46, 12); c.fill();
        c.fillStyle = '#fff'; c.font = 'bold 21px Fredoka, sans-serif'; c.fillText('RESGATAR PRÊMIO', p.x + p.w / 2, p.y + 165);
        const b = p.bx; c.fillStyle = 'rgba(255,255,255,.85)'; c.fillRect(b.x, b.y, b.s, b.s);
        c.fillStyle = '#444'; c.font = 'bold 12px sans-serif'; c.fillText('×', b.x + b.s / 2, b.y + b.s - 2);
      }
    },
    click(a, L, x, y) { // o X é minúsculo; o botão grande abre outro anúncio
      const P = L.ad.pops;
      for (let i = P.length - 1; i >= 0; i--) {
        const p = P[i];
        if (x < p.x || x > p.x + p.w || y < p.y || y > p.y + p.h) continue;
        const b = p.bx;
        if (x >= b.x - 2 && x <= b.x + b.s + 2 && y >= b.y - 2 && y <= b.y + b.s + 2) { P.splice(i, 1); L.ad.next = L.t + 0.9; return true; }
        if (x > p.x + p.w / 2 - 120 && x < p.x + p.w / 2 + 120 && y > p.y + 134 && y < p.y + 180 && P.length < 3) newPop(L.ad, L, P.length);
        return true;
      }
      return false;
    },
    move(a, L, x, y) { // o X foge do mouse
      for (const p of L.ad.pops) {
        const b = p.bx;
        if (Math.hypot(x - (b.x + b.s / 2), y - (b.y + b.s / 2)) < 90) {
          let best = null, bd = -1;
          for (let k = 0; k < 8; k++) {
            const cx = p.x + 8 + Math.random() * (p.w - 24), cy = p.y + 8 + Math.random() * (p.h - 24), d = Math.hypot(x - cx, y - cy);
            if (d > bd) { bd = d; best = [cx, cy]; }
          }
          b.x = best[0]; b.y = best[1];
        }
      }
    }
  };

  // ---------- 2: bicho gigante ----------
  const GIANT = {
    init(a, L) { L.b = { done: false }; },
    update(a, L) {
      if (!L.b.done && L.t >= 4.2) { const x = a.safeX(150); mk(a, 'giant', x, 150, 168, 'giant'); a.reserve(x + 150); L.b.done = true; }
    }
  };

  // ---------- 3: "amigo" com portas ----------
  const FRIEND = {
    init(a, L) { L.f = { step: 0, msg: 0, msgT: 0.8 }; },
    update(a, L) {
      const F = L.f;
      if (L.t >= F.msgT) { F.msg = (F.msg + 1) % MSG.length; F.msgT = L.t + 2.2; }
      if (F.step === 0 && L.t >= 3) { const x = a.safeX(110); door(a, x, true); a.reserve(x + 46); F.step = 1; }
      else if (F.step === 1 && L.t >= 6 && !L.obs.some(o => o.src === 'friend' && o.x + o.w > L.dist)) {
        const x = a.safeX(110), d = a.v() * 0.55; door(a, x, true); door(a, x + d); a.reserve(x + d + 46); F.step = 2;
      }
    },
    draw(a, L) {
      const c = a.ctx, F = L.f, fx = a.PX + 150, fy = 74 + Math.sin(L.t * 3) * 6;
      c.save(); c.globalAlpha = 0.95; a.emo('😎', 46, fx, fy + 16); c.restore();
      const txt = MSG[F.msg]; c.font = 'bold 16px Fredoka, sans-serif'; const w = c.measureText(txt).width + 26;
      c.fillStyle = '#fff'; c.strokeStyle = '#7c3aed'; c.lineWidth = 3; rr(c, fx + 34, fy - 26, w, 36, 12); c.fill(); c.stroke();
      c.fillStyle = '#4c1d95'; c.textAlign = 'left'; c.fillText(txt, fx + 47, fy - 3);
    }
  };

  // ---------- 4: linha de chegada que foge (depois acelera e enche de obstáculos) ----------
  const LINE = {
    init(a, L) { L.l = { x: null, flee: 0, wall: false }; L.ramp = 0; },
    update(a, L, dt) {
      const S = L.l;
      if (S.x === null && L.t >= 1.2) S.x = L.dist + 1000;
      if (S.x === null) return;
      if (S.x - L.dist < 330) { S.flee += dt; S.x += a.base(L.t) * 2.2 * dt; }
      if (S.flee >= 2.8) { L.ramp = Math.min(1, L.ramp + dt / 2.5); L.mul = 1 + 0.7 * L.ramp; L.gapMul = 1 - 0.5 * L.ramp; L.rampSrc = 'line'; }
      if (S.flee >= 4.6 && !S.wall) { S.wall = true; const x = a.safeX(110), d = a.v() * 0.55; wall(a, x, 'line'); wall(a, x + d, 'line'); a.reserve(x + d + 40); }
    },
    draw(a, L) {
      const c = a.ctx, S = L.l;
      if (S.x === null) return;
      const sx = a.PX + (S.x - L.dist);
      if (sx < a.W + 60 && sx > -60) {
        c.fillStyle = '#1d1b4b'; c.fillRect(sx - 3, a.GROUND - 130, 6, 130);
        for (let i = 0; i < 4; i++) for (let j = 0; j < 8; j++) { c.fillStyle = (i + j) % 2 ? '#fff' : '#1d1b4b'; c.fillRect(sx + i * 11, a.GROUND - 130 + j * 11, 11, 11); }
        c.fillStyle = '#ffd23f'; c.font = 'bold 15px Fredoka, sans-serif'; c.textAlign = 'center'; c.fillText('CHEGADA', sx + 22, a.GROUND - 138);
      }
      if (S.flee > 0.2) {
        const t = L.ramp > 0.3 ? 'Não pare agora! Bônus x2!' : 'QUASE LÁ! Só mais um pouquinho…';
        c.fillStyle = '#fff'; c.strokeStyle = '#ea580c'; c.lineWidth = 3; c.font = 'bold 22px Fredoka, sans-serif';
        const w = c.measureText(t).width + 34; rr(c, a.W / 2 - w / 2, 44, w, 38, 12); c.fill(); c.stroke();
        c.fillStyle = '#c2410c'; c.textAlign = 'center'; c.fillText(t, a.W / 2, 70);
      }
    }
  };

  return { 0: GIFT, 1: AD, 2: GIANT, 3: FRIEND, 4: LINE };
})();

/* ===== Corredor: motor do jogo ===== */
const Runner = (() => {
  const W = 900, H = 300, GROUND = 248, PX = 96, GRAV = 2600, JUMPV = 820, PH = 50, PHD = 27, PWID = 36, AIR = 2 * JUMPV / GRAV;
  const FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  const rand = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
  const base = t => Math.min(540, 360 + 4 * t);

  function create(canvas, hooks) {
    const SC = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = W * SC; canvas.height = H * SC;
    const c = canvas.getContext('2d'); c.scale(SC, SC);
    let S = { mode: 'idle', cfg: {}, lap: { t: 0, dist: 0, y: 0, vy: 0, obs: [] } }, raf = 0, lastT = 0, lastEmit = 0, duck = false;
    const emo = (ch, size, x, y, al) => { c.font = size + 'px ' + FONT; c.textAlign = al || 'center'; c.textBaseline = 'alphabetic'; c.fillText(ch, x, y); };
    const txt = (s, x, y, size, color, al, w) => { c.font = (w || 'bold') + ' ' + size + 'px Fredoka, sans-serif'; c.fillStyle = color; c.textAlign = al || 'center'; c.textBaseline = 'alphabetic'; c.fillText(s, x, y); };
    const A = { W, H, GROUND, PX, AIR, rand, pick, base, ctx: c, emo,
      v: () => base(S.lap.t) * S.lap.mul,
      spawn: o => { S.lap.obs.push(o); return o; },
      farEnd: () => S.lap.obs.reduce((m, o) => Math.max(m, o.x + o.w), S.lap.dist + PX),
      safeX: off => Math.max(S.lap.dist + W + off, A.farEnd() + A.v() * 1.15),
      reserve: e => { S.lap.quiet = Math.max(S.lap.quiet, e + 230 - (W + 40)); } };
    const trick = () => Tricks[S.cfg.trick];

    function newLap() {
      S.lap = { t: 0, dist: 0, y: 0, vy: 0, obs: [], nextSpawn: 300, quiet: 0, mul: 1, gapMul: 1, rampSrc: null };
      const T = trick(); if (T) T.init(A, S.lap);
    }
    function spawnNormal() {
      const L = S.lap, v = A.v(), r = Math.random();
      let o;
      if (L.t > 5 && r < 0.25) o = { type: 'bird', w: 40, h: 28, b: 34 };

/* ===== Aplicativo: aluno e professor ===== */
const $ = id => document.getElementById(id);
const HOST = location.hash === '#professor';
const store = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } };

const post = (u, b) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(r => r.status).catch(() => 0);

// ---------- conexão ----------
function connect() {
  const es = new EventSource('/events?' + (HOST ? 'pin=' + encodeURIComponent(pin) : 't=' + encodeURIComponent(tok)));
  es.onmessage = e => {
    S = JSON.parse(e.data); recv = Date.now(); off = false;
    if (!HOST && myAv && !S.me && !rejoining) { rejoining = true; post('/join', { t: tok, av: myAv }).then(s => { if (s !== 200) { myAv = null; store('trilha_av', null); } rejoining = false; }); }
    render();
  };
  es.onerror = () => { off = true; if (S) render(); };
}
async function start() {
  if (HOST) {
    if (!pin) pin = prompt('Senha do professor:') || '';
    while ((await post('/host', { pin, a: 'ping' })) === 401) pin = prompt('Senha incorreta. Digite de novo:') || '';
    store('trilha_pin', pin);
  }
  connect();
}

// ---------- ajuda de tela ----------
const VIEWS = ['pick', 'game', 'report', 'discuss', 'vote', 'result', 'end'];
function show(n) { VIEWS.forEach(v => $('v-' + v).hidden = v !== n); }

  const r = RULES[id], tag = click ? 'button' : 'div';
  return `<${tag} class="rule ${i === sel ? 'sel' : ''}" ${click ? `onclick="vote(${i})"` : ''}><b>${r.t}</b>${r.d}${extra ? extra(i) : ''}</${tag}>`;
}).join('');

// ---------- aluno ----------
function join(av) { post('/join', { t: tok, av }).then(s => { if (s === 200) { myAv = av; store('trilha_av', av); err = ''; } else err = s === 409 ? 'Esse personagem já foi escolhido. Escolha outro.' : 'Não deu para entrar. Avise o professor.'; render(); }); }

function vote(i) { post('/vote', { t: tok, c: i }); S.me.vote = i; render(); }

function renderStrip() {
  const lane = $('lane'), me = S.me ? S.me.av : '';
  if (lane.dataset.n !== String(S.team.length)) { lane.dataset.n = S.team.length; lane.innerHTML = ''; }
  S.team.forEach((t, i) => {
    let d = lane.querySelector('[data-av="' + t.av + '"]');
    if (!d) { d = document.createElement('div'); d.className = 'mate' + (t.av === me ? ' me' : ''); d.dataset.av = t.av; d.dataset.c = t.c; d.innerHTML = t.av + '<i></i>'; lane.appendChild(d); }
    d.style.left = `calc(${t.p * 100}% - ${t.p * 28}px)`; d.style.top = (i % 3) * 22 + 'px';
    if (+d.dataset.c !== t.c) { d.dataset.c = t.c; d.classList.remove('hit'); void d.offsetWidth; d.classList.add('hit'); }

}
function ensureRunner() {
  if (runner) return runner;
  const cv = $('cv');
  runner = Runner.create(cv, {
    onProgress: s => { if (curRun > 0 && S && S.phase === 'run') post('/prog', Object.assign({ t: tok, runId: curRun }, s)); },
    onFinish: () => {}

  const pt = (e, type) => { const r = cv.getBoundingClientRect(); runner.pointer((e.clientX - r.left) * Runner.W / r.width, (e.clientY - r.top) * Runner.H / r.height, type); };

  cv.addEventListener('pointermove', e => pt(e, 'move'));

    if (['ArrowDown', 'ArrowUp', ' ', 'Spacebar'].includes(e.key) && !$('v-game').hidden) e.preventDefault();
    if (e.repeat) return;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') runner.jump();
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') runner.duck(true);

}
function gameSync() {
  const R = ensureRunner();

    if (curRun === S.runId) return;
    curRun = S.runId;
    const loc = Date.now() + (S.startAt - S.now), trick = S.kind === 'trick' ? S.me.trick : null;
    if (Date.now() > loc + S.dur) { R.stop('Tempo!'); return; }

    R.start({ avatar: myAv, trick, kind: S.kind, L: S.kind === 'final' ? 60000 : 8000, startAt: loc, endAt: loc + S.dur });
  } else if (S.phase === 'lobby') {
    if (curRun !== -2) { curRun = -2; R.start({ avatar: myAv, trick: null, kind: 'practice', L: 1e9, startAt: Date.now() }); }
  } else if (curRun !== -9) { curRun = -9; R.stop(); }
}
function gameText() {
  let t = '';
  if (S.phase === 'lobby') t = `<b>Você está dentro, ${myAv}!</b> Treine à vontade. O objetivo do grupo é simples: <b>todos precisam chegar ao final</b>. O Jogo vai tentar impedir. Espere o professor começar.`;
  else if (S.phase === 'run' && S.kind === 'trick' && S.me.trick == null) t = 'Você entrou no meio da rodada. Treine até a próxima começar.';
  else if (S.phase === 'run') t = S.kind === 'final' ? 'Corrida final! Se tudo estiver justo, todos chegam. Vá firme.' : 'Chegue ao final. Pule com espaço ou ↑ e abaixe com ↓.';

}

function renderStudent() {
  const me = S.me;

}
function renderEnd() {
  if (S.allFin) setView('end', 'win', `<div class="card ok"><h2>🎉 Todos chegaram ao final, juntos!</h2><p><b>As regras que vocês criaram:</b></p><ul>${S.adopted.map(i => `<li><b>${RULES[i].t}.</b> ${RULES[i].k}</li>`).join('')}</ul>${S.skipped ? '<p class="mut">O professor adiantou a corrida final, então alguns truques não chegaram a ser derrubados pela turma.</p>' : ''}<p>Essas regras existem de verdade. É o <b>ECA Digital</b> (Lei 15.211/2025): uma lei que obriga quem cria jogos e redes a proteger crianças e adolescentes, sem tirar o direito de jogar e de usar a internet. A lei não está contra vocês. Ela está do lado de vocês.</p><p class="mut"><b>Para conversar:</b> qual truque foi o mais difícil de perceber? Vocês já viram algum desses em jogos ou aplicativos de verdade?</p></div>`);
  else setView('end', 'lose' + S.runId, `<div class="card no"><h2>Quase! Nem todos chegaram ao final</h2><p>O tempo acabou antes de todos cruzarem a linha. Conversem: o que aconteceu? O professor pode abrir mais uma tentativa.</p></div>`);
}

// ---------- professor ----------
function H(a) { if (a === 'reset' && !confirm('Reiniciar tudo? Todos os alunos terão que escolher personagem de novo.')) return; if (a === 'finalnow' && !confirm('Pular direto para a corrida final? Os truques restantes serão removidos.')) return; post('/host', { pin, a }); }
const B = (a, l, c) => `<button class="${c || 'btn big'}" onclick="H('${a}')">${l}</button>`;
function stateOf(t) {
  if (S.phase === 'run') return t.f ? '<span class="pill ok">chegou</span>' : t.c ? '<span class="pill no">correndo, bateu ' + t.c + '</span>' : '<span class="pill">correndo</span>';
  if (S.phase === 'report') return t.r ? '<span class="pill ok">já leu</span>' : '<span class="pill">lendo…</span>';
  return '';
}
function renderHost() {
  const ph = S.phase, lab = { lobby: 'Sala de espera', run: S.kind === 'final' ? 'Corrida final' : 'Corrida com truques', report: 'Relatórios pessoais', discuss: 'Conversa em grupo', vote: 'Votação', result: 'Resultado da votação', end: 'Fim' }[ph];
  let left = '';
  if (ph === 'run') { const rem = Math.round((S.startAt - S.now + S.dur - (Date.now() - recv)) / 1000); left = rem > S.dur / 1000 ? ' · começa em ' + Math.ceil(rem - S.dur / 1000) + 's' : S.kind === 'final' ? ' · limite em ' + Math.max(0, rem) + 's' : ' · restam ' + Math.max(0, rem) + 's'; }
  let ctrl = '', tip = '';
  if (ph === 'lobby') { ctrl = B('start', 'Começar a primeira rodada').replace('class="btn big"', `class="btn big" ${S.n ? '' : 'disabled'}`); tip = `Peça aos alunos para abrirem <b>${esc(location.origin)}</b> e escolherem um personagem. Eles já podem treinar.`; }
  else if (ph === 'run') { ctrl = B('endrun', 'Encerrar a rodada agora', 'ghost'); tip = S.kind === 'final' ? 'Todos correndo sem truques. A rodada acaba quando o último chega.' : 'Cada aluno tem um truque diferente. Ninguém consegue chegar. Observe a tabela.'; }
  else if (ph === 'report') { ctrl = B('force', 'Seguir para a conversa mesmo sem todos', 'ghost'); tip = `Cada aluno está lendo o que o Jogo fez com ele. <b>${S.nr} de ${S.n}</b> já clicaram em "Já li".`; }
  else if (ph === 'discuss') { ctrl = B('vote', 'Abrir a votação'); tip = 'Conduza a conversa em voz alta: o que apareceu na tela de cada um? Era falta de habilidade ou o jogo estava armado?'; }
  else if (ph === 'vote') { ctrl = B('close', 'Encerrar a votação').replace('class="btn big"', `class="btn big" ${S.nv ? '' : 'disabled'}`); tip = `<b>${S.nv} de ${S.n}</b> votaram. Deixe a turma debater antes de encerrar.`; }
  else if (ph === 'result') { ctrl = B('next', S.alive.length ? 'Próxima rodada' : 'Começar a corrida final'); tip = 'Comente com a turma o que a regra aprovada resolve.'; }
  else { ctrl = (S.allFin ? '' : B('again', 'Tentar a corrida final de novo')); tip = S.allFin ? 'Todos chegaram. Feche com a conversa sobre o ECA Digital.' : 'Nem todos chegaram a tempo.'; }
  let extra = '';
  if (ph === 'vote' || ph === 'result') { const c = S.counts || []; extra = `<div class="card"><h2>Votos</h2><div class="grid">${rulesCards(S.cards, ph === 'result' ? S.cards.indexOf(S.res) : -1, false, i => `<div class="bar"><i style="width:${S.n ? c[i] / S.n * 100 : 0}%"></i></div><small>${c[i] || 0} voto${c[i] === 1 ? '' : 's'}</small>`)}</div></div>`; }
  const rows = S.team.map(t => `<tr><td class="e">${t.av}</td><td>${t.trick != null && ph !== 'lobby' && S.kind !== 'final' ? TRK[t.trick].e + ' ' + TRK[t.trick].n : '—'}</td><td>${stateOf(t)}</td><td>${t.c}</td><td>${Math.round(t.p * 100)}%</td></tr>`).join('');
  const alive = [0, 1, 2, 3, 4].map(i => S.alive.includes(i) ? `<span class="pill no">${TRK[i].e} ativo</span>` : `<span class="pill ok">${TRK[i].e} removido</span>`).join(' ');
  const skip = ['report', 'discuss', 'vote', 'result'].includes(ph) && S.alive.length ? B('finalnow', 'Pular para a corrida final', 'warn') : '';
  $('host').innerHTML = `${off ? '<div class="conn">Sem conexão. Tentando de novo...</div>' : ''}
   <div class="top"><span>Painel do professor</span><span>${lab}${left}</span><span>Rodada ${S.round} · ${S.n} aluno${S.n === 1 ? '' : 's'}</span></div>
   <div class="card"><h2>${lab}</h2><p>${tip}</p><div class="act">${ctrl}</div></div>
   <div class="card"><h2>Truques do Jogo</h2><p>${alive}</p></div>${extra}
   <div class="card"><h2>Alunos</h2><table><tr><th></th><th>Truque no jogo dele</th><th>Estado</th><th>Batidas</th><th>Chegou a</th></tr>${rows || '<tr><td colspan="5" class="mut">Ninguém entrou ainda.</td></tr>'}</table></div>
   <div class="act">${skip}${B('reset', 'Reiniciar tudo', 'ghost')}</div>`;
}

function render() {
  if (!S) return;
  if (HOST) { $('app').hidden = true; $('host').hidden = false; renderHost(); return; }
  $('bar').innerHTML = (off ? '<div class="conn">Sem conexão. Tentando de novo...</div>' : '') + `<div class="top"><span>Atravessem a Trilha</span><span>${S.phase === 'lobby' ? 'Sala de espera' : 'Rodada ' + S.round}</span><span>${S.n} jogador${S.n === 1 ? '' : 'es'}</span></div>`;
  renderStudent();
}
if (HOST) setInterval(() => { if (S && S.phase === 'run') renderHost(); }, 1000);
start();

</script>
</body>
</html>
