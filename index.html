/* Visual arcade anos 80/90: fontes pixeladas, bordas retas, sombras duras */
:root{--bg:#120c2e;--card:#1e1650;--card2:#2a1f6b;--tx:#f4f0ff;--mut:#b9a8ff;--ln:#4b3bb5;--bad:#ff5b6e;--good:#3ddc84;--acc:#ffd23f;--cy:#4dd2ff;--pk:#ff4d8d;--ink:#05031a}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font-family:'VT323','Courier New',monospace;font-size:clamp(22px,2vw,28px);line-height:1.15;
  background-color:var(--bg);background-image:radial-gradient(#3a2a8a 1.5px,transparent 1.5px),radial-gradient(#26195f 1.5px,transparent 1.5px);background-size:48px 48px;background-position:0 0,24px 24px;image-rendering:pixelated}
main{max-width:1060px;margin:0 auto;padding:12px 16px 40px}
.px-font,h1,h2,button,.pill,.stat,th,.top,.lbl{font-family:'Press Start 2P','Courier New',monospace;font-weight:400}
h1{font-size:clamp(20px,3.2vw,34px);margin:0 0 14px;line-height:1.35;color:var(--acc);text-shadow:4px 4px 0 var(--ink)}
h2{font-size:clamp(14px,1.9vw,20px);margin:0 0 12px;line-height:1.5;color:var(--acc);text-shadow:3px 3px 0 var(--ink)}
p{margin:0 0 10px;max-width:60ch}
b{font-weight:400;color:var(--acc)}
[hidden]{display:none!important}
.mut{color:var(--mut)}
.card{background:var(--card);border:4px solid var(--ink);box-shadow:inset 0 0 0 4px var(--ln),8px 8px 0 var(--ink);padding:22px 24px;margin-top:16px}
.card.ok{box-shadow:inset 0 0 0 4px var(--good),8px 8px 0 var(--ink)}
.card.no{box-shadow:inset 0 0 0 4px var(--bad),8px 8px 0 var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;flex-wrap:wrap;line-height:1.6;color:var(--cy);padding:6px 2px}
.conn{background:var(--bad);color:#fff;text-align:center;padding:8px;margin-bottom:8px;font-family:'Press Start 2P',monospace;font-size:11px}
button{font-family:'Press Start 2P','Courier New',monospace;font-size:12px;line-height:1.5;border:4px solid var(--ink);padding:14px 18px;cursor:pointer;color:var(--tx);background:var(--card2);box-shadow:inset 0 0 0 3px var(--ln),4px 4px 0 var(--ink);border-radius:0}
button:hover:not(:disabled){background:#38298f}
button:active:not(:disabled){transform:translate(4px,4px);box-shadow:inset 0 0 0 3px var(--ln),0 0 0 var(--ink)}
.btn{background:var(--pk);color:#fff;box-shadow:inset 0 0 0 3px #ff9bc0,4px 4px 0 var(--ink)}
.btn:hover:not(:disabled){background:#ff6aa0}
.btn.big{font-size:14px;padding:18px 26px}
.btn:disabled,button:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:var(--card)}
.warn{background:#5a1630;box-shadow:inset 0 0 0 3px var(--bad),4px 4px 0 var(--ink);color:#ffd0d6}
:focus-visible{outline:4px dashed var(--acc);outline-offset:3px}
.act{text-align:center;margin-top:18px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.cvwrap{margin-top:10px;position:relative}
.cvwrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
#cv{width:100%;aspect-ratio:3/1;display:block;border:4px solid var(--ink);box-shadow:0 0 0 4px var(--ln),8px 8px 0 4px var(--ink);background:#2b2063;touch-action:manipulation;cursor:pointer;image-rendering:pixelated}
.hint{text-align:center;margin-top:16px;color:var(--mut)}
.strip{margin-top:14px;background:var(--card);border:4px solid var(--ink);box-shadow:inset 0 0 0 4px var(--ln);padding:8px 18px 6px}
.strip small{color:var(--cy);font-family:'Press Start 2P',monospace;font-size:10px}
.lane{position:relative;height:96px;margin-top:6px}
.lane::after{content:'';position:absolute;right:0;top:0;bottom:0;width:16px;background:repeating-conic-gradient(#05031a 0 25%,#fff 0 50%) 0 0/16px 16px;border:2px solid #05031a}
.mate{position:absolute;line-height:0;transition:left .5s linear}
.mate.hit{animation:hit .6s steps(6)}
.mate.me i{position:absolute;left:0;right:0;bottom:-6px;height:4px;background:var(--acc)}
.mate i{display:none}.mate.me i{display:block}
@keyframes hit{25%{transform:translateY(-8px)}75%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.mate.hit{animation:none}.mate{transition:none}}
.av-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:14px;margin-top:14px}
.av-pick button{padding:8px;line-height:0}
.big-e{line-height:0;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:14px}
.rule{text-align:left;font-family:'VT323',monospace;font-size:1em;line-height:1.1;padding:14px 16px;background:var(--card2);color:var(--tx);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--ln),4px 4px 0 var(--ink)}
.rule b{display:block;font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.5;margin-bottom:8px;color:var(--cy)}
.rule.sel{background:#5a2a8a;box-shadow:inset 0 0 0 3px var(--acc),4px 4px 0 var(--ink)}
.rule.sel b{color:var(--acc)}
.rule.win{box-shadow:inset 0 0 0 3px var(--good),4px 4px 0 var(--ink)}
.bar{height:16px;background:var(--ink);margin-top:10px;border:2px solid var(--ln)}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s steps(10)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.stat{border:3px solid var(--ln);background:var(--ink);padding:8px 10px;font-size:10px;line-height:1.4}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:1em}
th,td{text-align:left;padding:8px;border-bottom:3px solid var(--ln)}
th{font-size:10px;color:var(--cy)}
td.e{line-height:0}
.pill{display:inline-block;padding:4px 8px;font-size:10px;line-height:1.4;border:3px solid var(--ln);background:var(--ink)}
.pill.ok{border-color:var(--good);color:var(--good)}.pill.no{border-color:var(--bad);color:var(--bad)}
ul{padding-left:1.1em;margin:8px 0 12px}li{margin-bottom:8px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;display:inline-block}
/* telas curtas e visuais */
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.hero .big-e{margin:0}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.chip{display:flex;align-items:center;gap:10px;background:var(--card2);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--ln),4px 4px 0 var(--ink);padding:10px 14px;font-size:1em;line-height:1.05;max-width:100%}
.chip b{display:block;font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.5;margin-bottom:2px;color:var(--cy)}
.say{display:flex;gap:14px;align-items:center;background:var(--ink);border:3px solid var(--ln);padding:12px 14px;margin-top:12px}
.say.q{border-color:var(--acc)}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
.say p{margin:0}

<body>
<main>
  <div id="host" hidden></div>
  <div id="app">
    <div id="bar"></div>
    <section id="v-pick" hidden></section>
    <section id="v-game" hidden>
      <div class="cvwrap"><canvas id="cv" width="900" height="300" aria-label="Área do jogo"></canvas></div>
      <p class="hint" id="gtxt"></p>
      <div class="strip"><small>Seus colegas na pista</small><div class="lane" id="lane"></div></div>
    </section>
    <section id="v-report" hidden></section>
    <section id="v-discuss" hidden></section>
    <section id="v-vote" hidden></section>
    <section id="v-result" hidden></section>
    <section id="v-end" hidden></section>
  </div>
</main>
<script>
/* ===== Textos do jogo (truques, regras, lei) ===== */
const EM = Array.from({ length: 15 }, (_, i) => 'c' + i);
const TRK = [
  { n: 'O presente armadilha',
    d: 'O "prêmio" puxava você para baixo na hora de pular. O Jogo estava armado.' },
  { n: 'O anúncio que tapava tudo',
    d: 'Um anúncio cobriu a tela e escondeu os obstáculos. O X fugia do mouse.' },
  { n: 'O bicho gigante',
    d: 'Um bicho grande demais para pular. Não era falta de habilidade sua.' },
  { n: 'O "amigo" falso',
    d: 'Um desconhecido te chamou com promessas e abriu portas impossíveis.' },
  { n: 'A linha que fugia',
    d: 'A chegada sempre fugia e depois tudo acelerou. O Jogo não queria que você parasse.' }
];
const RULES = {
  0: { t: 'O jogo não pode enganar você', d: 'O que parece prêmio tem que ser prêmio de verdade.',
       k: 'O ECA Digital proíbe caixas de recompensa em jogos para menores.' },
  1: { t: 'O jogo não pode atrapalhar quem joga', d: 'Nada de interrupções no meio da partida.',
       k: 'A lei limita anúncios dirigidos a crianças e adolescentes.' },
  2: { t: 'O jogo tem que ser justo com todos', d: 'Todos precisam ter a mesma chance de vencer.',
       k: 'Quem cria o jogo é responsável por proteger quem joga.' },
  3: { t: 'O jogo tem que proteger você de desconhecidos', d: 'Ninguém chega perto de você sem você querer.',
       k: 'A lei prevê proteção por padrão e supervisão da família.' },
  4: { t: 'O jogo não pode prender você', d: 'Você pode parar quando quiser, sem perder o que fez.',
       k: 'Quem está crescendo tem prioridade na proteção.' },
  10: { t: 'Quem for mais rápido escolhe primeiro', d: 'Vantagem para quem já está na frente.', n: 'Isso ajuda quem já ia bem e deixa alguém para trás. Os truques continuam.' },
  11: { t: 'Pintar a pista de outras cores', d: 'Fica bonito!', n: 'Ficou bonito, mas os truques continuam iguais.' },
  12: { t: 'Quem fizer mais pontos ganha troféu', d: 'Mais competição!', n: 'Troféu não protege ninguém e ainda deixa o jogo mais competitivo. Os truques continuam.' },
  13: { t: 'Quem está na frente ganha um bônus', d: 'Prêmio para quem lidera.', n: 'Quem já estava bem não precisava de ajuda, e quem estava preso continua preso. Os truques continuam.' },
  14: { t: 'Efeitos de som em toda a pista', d: 'Mais emoção!', n: 'Mais barulho, mesmos truques. Nada protege os jogadores.' },
  15: { t: 'Deixar o jogo ainda mais rápido', d: 'Mais adrenalina!', n: 'Mais rápido só deixa tudo mais difícil. Os truques continuam.' }
};

/* ===== Pixel art: todos os desenhos são feitos em código (sem imagens externas) ===== */
const Pix = (() => {
  const OUT = '#1d1b4b';
  const cache = {}, urls = {};
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  // Adiciona um contorno escuro de 1 pixel em volta de tudo que foi desenhado.
  function outline(src) {
    const w = src.width, h = src.height, c = mk(w + 2, h + 2), x = c.getContext('2d');
    const d = src.getContext('2d').getImageData(0, 0, w, h).data, on = (i, j) => i >= 0 && j >= 0 && i < w && j < h && d[(j * w + i) * 4 + 3] > 0;
    x.fillStyle = OUT;
    for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) if (!on(i, j) && (on(i - 1, j) || on(i + 1, j) || on(i, j - 1) || on(i, j + 1))) x.fillRect(i + 1, j + 1, 1, 1);
    x.drawImage(src, 1, 1); return c;
  }
  function rows(r, pal, noOut) {
    const w = Math.max(...r.map(s => s.length)), c = mk(w, r.length), x = c.getContext('2d');
    r.forEach((s, j) => [...s].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, j, 1, 1); } }));
    return noOut ? c : outline(c);
  }
  function rects(w, h, list, noOut) {
    const c = mk(w, h), x = c.getContext('2d');
    for (const [col, a, b, cw, ch] of list) { x.fillStyle = col; x.fillRect(a, b, cw, ch); }
    return noOut ? c : outline(c);
  }

  // ---------- criaturas (personagens dos alunos e o "amigo") ----------
  const COLORS = ['#ff7a59', '#ffd23f', '#4ade80', '#38bdf8', '#a78bfa', '#f472b6', '#fb923c', '#2dd4bf', '#f87171', '#a3e635', '#60a5fa', '#e879f9', '#fbbf24', '#34d399', '#c084fc'];
  const SPECS = COLORS.map((col, i) => ({
    col, top: ['ears', 'horns', 'antenna', 'spikes', 'tuft'][i % 5], eyes: [2, 1, 3, 2, 2, 1, 2][i % 7], mouth: ['smile', 'tooth', 'o', 'grin'][i % 4], spots: i % 3 === 0
  }));
  function shade(hex, k) { const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(v * k))); return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => f(v).toString(16).padStart(2, '0')).join(''); }
  function creature(s, frame) {
    const c = mk(16, 16), x = c.getContext('2d'), dk = shade(s.col, 0.68), lt = shade(s.col, 1.25);
    const P = (col, a, b, w, h) => { x.fillStyle = col; x.fillRect(a, b, w || 1, h || 1); };
    // enfeites do topo
    if (s.top === 'ears') { P(s.col, 3, 1, 3, 4); P(s.col, 10, 1, 3, 4); P(dk, 4, 2, 1, 2); P(dk, 11, 2, 1, 2); }
    else if (s.top === 'horns') { P(lt, 3, 1, 2, 4); P(lt, 11, 1, 2, 4); P('#fff', 3, 1, 1, 1); P('#fff', 12, 1, 1, 1); }
    else if (s.top === 'antenna') { P(dk, 7, 1, 2, 3); P('#ffd23f', 6, 0, 4, 2); }
    else if (s.top === 'spikes') { P(dk, 4, 2, 2, 3); P(dk, 7, 1, 2, 4); P(dk, 10, 2, 2, 3); }
    else { P(dk, 6, 2, 1, 2); P(dk, 8, 1, 1, 3); P(dk, 9, 2, 1, 2); }
    // corpo
    const hw = [4, 5, 6, 6, 6, 6, 6, 5, 4];
    hw.forEach((w, j) => P(s.col, 8 - w, 4 + j, w * 2, 1));
    P(lt, 6, 10, 4, 2);
    if (s.spots) { P(dk, 3, 8, 2, 1); P(dk, 11, 6, 2, 1); P(dk, 10, 10, 1, 1); }
    // pés (alternam a cada quadro)
    if (frame === 0) { P(dk, 4, 13, 3, 2); P(dk, 10, 13, 3, 1); } else { P(dk, 4, 13, 3, 1); P(dk, 10, 13, 3, 2); }
    // olhos
    const eye = (a, b, big) => { P('#fff', a, b, 2, big ? 3 : 2); P(OUT, a + 1, b + (big ? 1 : 0), 1, 2); };
    if (s.eyes === 'shades') { P(OUT, 3, 6, 10, 2); P('#fff', 5, 6, 1, 1); P('#fff', 10, 6, 1, 1); }
    else if (s.eyes === 1) eye(7, 6, true);
    else if (s.eyes === 3) { eye(4, 7); eye(10, 7); eye(7, 5); }
    else { eye(4, 6); eye(10, 6); }
    // boca
    if (s.mouth === 'grin') { P(OUT, 4, 10, 8, 1); P('#fff', 5, 10, 6, 1); P(OUT, 5, 11, 6, 1); }
    else if (s.mouth === 'o') { P(OUT, 7, 10, 2, 2); }
    else if (s.mouth === 'tooth') { P(OUT, 5, 10, 6, 1); P('#fff', 7, 11, 2, 1); }
    else { P(OUT, 5, 10, 1, 1); P(OUT, 6, 11, 4, 1); P(OUT, 10, 10, 1, 1); }
    return outline(c);
  }
  const FRIEND = { col: '#ffd23f', top: 'tuft', eyes: 'shades', mouth: 'grin', spots: false };

  // ---------- obstáculos e cenário ----------
  const G = '#2e9e4a', GD = '#1c6b30', BR = '#8b5a2b', Y = '#ffd23f', R = '#e23b3b', RD = '#a32323', W = '#fff';
  const build = {
    cactus: () => rows(['.....GG....', '....GGGD...', '....GGGD...', '.GG.GGGD...', '.GG.GGGD.GG', '.GG.GGGD.GG', '.GGGGGGD.GG', '..DDGGGDGGD', '....GGGGGD.', '....GGGD...', '....GGGD...', '....GGGD...', '....GGGD...', '....GGGD...', '....GGGD...', '....GGGD...'], { G, D: GD }),
    pine: () => rows(['.....GG.....', '....GGGG....', '....GGGG....', '...GGGGGG...', '...GDGGGG...', '..GGGGGGGG..', '..GGDGGGGG..', '.GGGGGGGGGG.', '.GGGDGGGGGG.', 'GGGGGGGGGGGG', '.....BB.....', '.....BB.....', '.....BB.....'], { G, D: GD, B: BR }),
    bird0: () => rows(['..PP......PP..', '..PPP....PPP..', '...PPP..PPP...', '....PPPPPPPYY.', '.....PPWPPYYY.', '.....PPPPPP...', '......PPPP....'], { P: '#6d4fd1', W, Y }),
    bird1: () => rows(['..............', '....PPPPPP.YY.', '..PPPPPPWPYYY.', '.PPP.PPPPPP...', 'PP...PPPPPP...', '.....PPPPP....', '......PP......'], { P: '#6d4fd1', W, Y }),
    gift: () => rows(['...YY..YY...', '..Y..YY..Y..', '...YYYYYY...', 'RRRRRYYRRRRR', 'RRRRRYYRRRRR', 'YYYYYYYYYYYY', 'RRRRRYYRRRRR', 'RRRRRYYRRRRR', 'RRRRRYYRRRRR', 'RRRRRYYRRRRR', 'RRRRRYYRRRRR', 'DDDDDDDDDDDD'], { Y, R, D: RD }),
    bear: () => rects(24, 24, [
      [BR, 3, 12, 18, 11], [BR, 1, 13, 4, 9], [BR, 19, 13, 4, 9], ['#c99a64', 8, 15, 8, 8], ['#5a3516', 4, 22, 5, 2], ['#5a3516', 15, 22, 5, 2],
      [BR, 5, 3, 14, 10], [BR, 4, 2, 4, 4], [BR, 16, 2, 4, 4], ['#c99a64', 5, 3, 2, 2], ['#c99a64', 17, 3, 2, 2],
      ['#c99a64', 8, 8, 8, 5], ['#3b1d08', 11, 9, 2, 2], [W, 8, 6, 3, 2], [W, 13, 6, 3, 2], [OUT, 9, 6, 1, 2], [OUT, 14, 6, 1, 2],
      ['#5a3516', 7, 5, 4, 1], ['#5a3516', 13, 5, 4, 1], [W, 9, 12, 1, 1], [W, 11, 12, 1, 1], [W, 13, 12, 1, 1]]),
    door: () => rects(10, 24, [['#6b3f12', 0, 0, 10, 24], [BR, 1, 1, 8, 22], ['#b9814a', 2, 2, 6, 9], ['#b9814a', 2, 13, 6, 9], [Y, 7, 12, 2, 2]]),
    cloud: () => rows(['...WWW......', '..WWWWWWW...', '.WWWWWWWWWW.', 'WWWWWWWWWWWW'], { W: '#fff' }, true),
    trophy: () => rows(['YYYYYYYYYYYY', 'YWYYYYYYYYYY', 'Y.YWYYYYYY.Y', 'Y.YWYYYYYY.Y', '.YYWYYYYYYY.', '..YYYYYYYY..', '...YYYYYY...', '....YYYY....', '.....YY.....', '.....YY.....', '....YYYY....', '...YYYYYY...', '..DDDDDDDD..'], { Y, W: '#fff6b0', D: '#b8801a' }),
    shield: () => rows(['CCCCCCCCCCCC', 'CLLCCCCCCCCD', 'CLCCCCCCCGCD', 'CLCCCCCCGGCD', 'CCCGCCGGGCCD', 'CCCGGGGGCCCD', '.CCCGGGCCCD.', '.CCCCGCCCCD.', '..CCCCCCCD..', '...CCCCCD...', '....CCCD....', '.....CD.....'], { C: '#4dd2ff', L: '#b6ecff', D: '#2a8fb5', G: '#3ddc84' }),
    // ícones usados nos relatórios do professor e dos alunos
    ad: () => rects(14, 12, [[W, 0, 0, 14, 12], ['#ff3b6b', 0, 0, 14, 3], [W, 11, 1, 2, 1], ['#16a34a', 3, 7, 8, 3], ['#1d1b4b', 3, 4, 8, 1]]),
    flag: () => { const o = [['#e8e8f0', 0, 0, 2, 16]]; for (let j = 0; j < 4; j++) for (let i = 0; i < 5; i++) o.push([(i + j) % 2 ? W : '#6a58e0', 2 + i * 2, j * 2, 2, 2]); return rects(12, 16, o); }
  };
  const iconKey = { 0: 'gift', 1: 'ad', 2: 'bear', 3: 'friend', 4: 'flag' };

  function get(name, frame) {
    if (!name) name = 'c0';
    const key = name + ':' + (frame || 0);
    if (cache[key]) return cache[key];
    let c;
    if (/^c\d+$/.test(name)) c = creature(SPECS[+name.slice(1) % SPECS.length], frame || 0);
    else if (name === 'friend') c = creature(FRIEND, frame || 0);
    else { if (!build[name]) throw new Error('sprite? ' + name); c = build[name](); }
    return (cache[key] = c);
  }
  // Desenha centralizado em x, com a base em by e altura h. Ret: largura desenhada.
  function draw(c, name, x, by, h, frame, flip) {
    const s = get(name, frame), w = s.width * h / s.height;
    c.imageSmoothingEnabled = false;
    if (flip) { c.save(); c.translate(x, 0); c.scale(-1, 1); c.drawImage(s, -w / 2, by - h, w, h); c.restore(); }
    else c.drawImage(s, x - w / 2, by - h, w, h);
    return w;
  }
  // Para o HTML: imagem ampliada em pixels nítidos.
  function url(name) {
    if (urls[name]) return urls[name];
    const s = get(name, 0), k = 6, c = mk(s.width * k, s.height * k), x = c.getContext('2d');
    x.imageSmoothingEnabled = false; x.drawImage(s, 0, 0, c.width, c.height);
    return (urls[name] = c.toDataURL());
  }
  const img = (name, px, cls) => { const s = get(name, 0); return `<img class="px ${cls || ''}" src="${url(name)}" width="${Math.round(px * s.width / s.height)}" height="${px}" alt="" draggable="false">`; };
  // Desenha esticando para uma largura e altura específicas (base em by).
  function drawWH(c, name, x, by, w, h, frame) { c.imageSmoothingEnabled = false; c.drawImage(get(name, frame || 0), x - w / 2, by - h, w, h); }
  const icon = i => iconKey[i] || 'gift';
  return { get, draw, drawWH, url, img, icon, count: SPECS.length };
})();

/* ===== Truques do Jogo (cada um tem um roteiro que garante a batida) ===== */
const rr = (c, x, y, w, h, r) => { const k = Math.min(r > 8 ? 6 : 4, w / 4, h / 4); c.beginPath(); c.moveTo(x + k, y); c.lineTo(x + w - k, y); c.lineTo(x + w - k, y + k); c.lineTo(x + w, y + k); c.lineTo(x + w, y + h - k); c.lineTo(x + w - k, y + h - k); c.lineTo(x + w - k, y + h); c.lineTo(x + k, y + h); c.lineTo(x + k, y + h - k); c.lineTo(x, y + h - k); c.lineTo(x, y + k); c.lineTo(x + k, y + k); c.closePath(); };
const Tricks = (() => {
  const MSG = ['Oi! Vem comigo, tenho um prêmio só para você!', 'Corre, essa chance é só de hoje!', 'Aqui dentro é muito melhor, entra!', 'Todo mundo já entrou, só falta você!', 'Confia em mim, eu sou seu amigo!'];
  const mk = (a, type, x, w, h, src, extra) => a.spawn(Object.assign({ type, x, w, h, b: 0, src }, extra));
  const gift = (a, x, label, pull) => mk(a, 'gift', x, 36, 36, 'gift', { label, pull });
  // Cacto que parece normal e cresce de repente quando o jogador chega perto (o Jogo trapaceia).
  const rise = (a, x, src) => mk(a, 'rise', x, 26, 44, src);
  const door = (a, x, label) => mk(a, 'door', x, 46, 114, 'friend', { label });
  const passed = (a, L, o) => o.x + o.w < L.dist + a.PX - 14;

  // ---------- 0: presente que era armadilha ----------
  const GIFT = {
    init(a, L) { const n = a.rand(7, 10); L.g = { stage: 0, next: n, watch: null, force: n + a.rand(5, 7), n1: Math.random() < 0.5 ? 2 : 3 }; },
    update(a, L) {
      const G = L.g;
      if (G.watch && passed(a, L, G.watch)) { G.watch = null; G.next = L.t + a.rand(0.5, 1.2); } // desviou: vêm mais
      if (G.stage >= 3 || G.watch) return;
      const force = L.t >= G.force && G.stage < 2;
      if (force) G.stage = 2;
      if (L.t < G.next && !force) return;
      let x = a.safeX(120);
      if (G.stage === 0) { G.watch = gift(a, x, true); a.reserve(x + 40); }
      else {
        // fase 1: 2 ou 3 presentes espaçados (dá para pular, com habilidade); fase 2: o último puxa para baixo
        const n = G.stage === 1 ? G.n1 : 3, pull = G.stage === 2;
        for (let i = 0; i < n; i++) { const o = gift(a, x, i === 0, pull); if (i === n - 1) G.watch = o; x += 36 + a.rand(95, 190); }
        a.reserve(x);
      }
      G.stage++;
    }
  };

  // ---------- 1: anúncio no meio do jogo ----------
  const newPop = (A, L, k) => {
    const p = { x: 150 - k * 22, y: 48 + k * 9, w: 620, h: 200, born: L.t, bx: { x: 0, y: 0, s: 12 } };
    p.bx.x = p.x + p.w - 22; p.bx.y = p.y + 9; A.pops.push(p);
  };
  const AD = {
    init(a, L) { L.ad = { pops: [], next: a.rand(7, 11), n: 0 }; },
    update(a, L) {
      const A = L.ad, n0 = A.pops.length;
      A.pops = A.pops.filter(p => L.t - p.born < 7);
      if (n0 && !A.pops.length) A.next = L.t + 0.9;
      // enquanto o anúncio tapa a tela, os obstáculos vêm mais juntos (e contam como culpa do truque)
      L.gapMul = A.pops.length ? 0.7 : 1; L.rampSrc = A.pops.length ? 'ad' : null;
      if (!A.pops.length && L.t >= A.next && A.n < 5) {
        newPop(A, L, 0); A.n++;
        if (A.n === 3) { const x = a.safeX(130); rise(a, x, 'ad'); a.reserve(x + 40); } // se ainda estiver vivo, um cacto surpresa
      }
    },
    draw(a, L) {
      const c = a.ctx;
      for (const p of L.ad.pops) {
        c.fillStyle = a.INK; c.fillRect(p.x - 4 + 6, p.y - 4 + 6, p.w + 8, p.h + 8);
        c.fillStyle = a.INK; c.fillRect(p.x - 4, p.y - 4, p.w + 8, p.h + 8);
        c.fillStyle = '#ff3b6b'; c.fillRect(p.x, p.y, p.w, p.h);
        c.fillStyle = '#fff6d6'; c.fillRect(p.x + 4, p.y + 30, p.w - 8, p.h - 34);
        a.txt('ANÚNCIO', p.x + 14, p.y + 21, 10, '#fff', 'left');
        a.txt('PARABÉNS!', p.x + p.w / 2, p.y + 82, 26, '#1d1b4b');
        a.txt('Você é o visitante número 1.000.000!', p.x + p.w / 2, p.y + 116, 26, '#3b2aa8', 'center', a.VT);
        c.fillStyle = a.INK; c.fillRect(p.x + p.w / 2 - 124, p.y + 130, 248, 54); c.fillStyle = '#16a34a'; c.fillRect(p.x + p.w / 2 - 120, p.y + 134, 240, 46);
        c.fillStyle = '#4ade80'; c.fillRect(p.x + p.w / 2 - 120, p.y + 134, 240, 6);
        a.txt('RESGATAR PRÊMIO', p.x + p.w / 2, p.y + 163, 12, '#fff', 'center', a.PF, true);
        const b = p.bx; c.fillStyle = '#fff'; c.fillRect(b.x, b.y, b.s, b.s);
        c.fillStyle = a.INK; c.fillRect(b.x + 2, b.y + 2, 2, 2); c.fillRect(b.x + 8, b.y + 2, 2, 2); c.fillRect(b.x + 4, b.y + 4, 4, 4); c.fillRect(b.x + 2, b.y + 8, 2, 2); c.fillRect(b.x + 8, b.y + 8, 2, 2);

    },

        if (type === 'move') { if (T.move) T.move(A, S.lap, x, y); return; }
        if (T.click && T.click(A, S.lap, x, y)) return;
        this.jump();
      },
      mode: () => S.mode,
      info: () => ({ mode: S.mode, lap: S.lap, crashes: S.crashes, cn: S.cn, ct: S.ct, fin: S.fin })
    };
  }
  return { create, W, H };
})();

/* ===== Aplicativo: aluno e professor ===== */
try { ['12px "Press Start 2P"', '24px VT323'].forEach(f => document.fonts.load(f)); } catch (e) {}
const $ = id => document.getElementById(id);
const HOST = location.hash === '#professor';
const store = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } };
let tok = store('trilha_t'); if (!tok) { tok = Math.random().toString(36).slice(2) + Date.now().toString(36); store('trilha_t', tok); }
let myAv = store('trilha_av'), pin = store('trilha_pin'), S = null, recv = 0, off = false, err = '', runner = null, curRun = -9, readyRun = -1, rejoining = false;
const post = (u, b) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(r => r.status).catch(() => 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- conexão ----------
function connect() {
  const es = new EventSource('/events?' + (HOST ? 'pin=' + encodeURIComponent(pin) : 't=' + encodeURIComponent(tok)));
  es.onmessage = e => {
    S = JSON.parse(e.data); recv = Date.now(); off = false;
    if (!HOST && myAv && !S.me && !rejoining) { rejoining = true; post('/join', { t: tok, av: myAv }).then(s => { if (s !== 200) { myAv = null; store('trilha_av', null); } rejoining = false; }); }
    render();
  };
  es.onerror = () => { off = true; if (S) render(); };
}
async function start() {
  if (HOST) {
    if (!pin) pin = prompt('Senha do professor:') || '';
    while ((await post('/host', { pin, a: 'ping' })) === 401) pin = prompt('Senha incorreta. Digite de novo:') || '';
    store('trilha_pin', pin);
  }
  connect();
}

// ---------- ajuda de tela ----------
const VIEWS = ['pick', 'game', 'report', 'discuss', 'vote', 'result', 'end'];
function show(n) { VIEWS.forEach(v => $('v-' + v).hidden = v !== n); }
function setView(n, key, html) { const el = $('v-' + n); if (el.dataset.k !== key) { el.dataset.k = key; el.innerHTML = html; } }
const rulesCards = (cards, sel, click, extra) => cards.map((id, i) => {
  const r = RULES[id], tag = click ? 'button' : 'div';
  return `<${tag} class="rule ${i === sel ? 'sel' : ''}" ${click ? `onclick="vote(${i})"` : ''}><b>${r.t}</b>${r.d}${extra ? extra(i) : ''}</${tag}>`;
}).join('');

// ---------- aluno ----------
function join(av) { post('/join', { t: tok, av }).then(s => { if (s === 200) { myAv = av; store('trilha_av', av); err = ''; } else err = s === 409 ? 'Esse personagem já foi escolhido. Escolha outro.' : 'Não deu para entrar. Avise o professor.'; render(); }); }
function ready() { readyRun = S.runId; post('/ready', { t: tok }); render(); }
function vote(i) { post('/vote', { t: tok, c: i }); S.me.vote = i; render(); }

function renderStrip() {
  const lane = $('lane'), me = S.me ? S.me.av : '';
  if (lane.dataset.n !== String(S.team.length)) { lane.dataset.n = S.team.length; lane.innerHTML = ''; }
  S.team.forEach((t, i) => {
    let d = lane.querySelector('[data-av="' + t.av + '"]');
    if (!d) { d = document.createElement('div'); d.className = 'mate' + (t.av === me ? ' me' : ''); d.dataset.av = t.av; d.dataset.c = t.c; d.innerHTML = Pix.img(t.av, 28) + '<i></i>'; lane.appendChild(d); }
    d.style.left = `calc(${t.p * 100}% - ${t.p * 28}px)`; d.style.top = (i % 3) * 30 + 'px';
    if (+d.dataset.c !== t.c) { d.dataset.c = t.c; d.classList.remove('hit'); void d.offsetWidth; d.classList.add('hit'); }
  });
}
function ensureRunner() {
  if (runner) return runner;
  const cv = $('cv');
  runner = Runner.create(cv, {
    onProgress: s => { if (curRun > 0 && S && S.phase === 'run') post('/prog', Object.assign({ t: tok, runId: curRun }, s)); },
    onFinish: () => {}
  });
  const pt = (e, type) => { const r = cv.getBoundingClientRect(); runner.pointer((e.clientX - r.left) * Runner.W / r.width, (e.clientY - r.top) * Runner.H / r.height, type); };
  cv.addEventListener('pointerdown', e => pt(e, 'down'));
  cv.addEventListener('pointermove', e => pt(e, 'move'));
  window.addEventListener('keydown', e => {
    if (['ArrowDown', 'ArrowUp', ' ', 'Spacebar'].includes(e.key) && !$('v-game').hidden) e.preventDefault();
    if (e.repeat) return;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') runner.jump();
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') runner.duck(true);
  });
  window.addEventListener('keyup', e => { if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') runner.duck(false); });
  return runner;
}
function gameSync() {
  const R = ensureRunner();
  if (S.phase === 'run') {
    if (curRun === S.runId) return;
    curRun = S.runId;
    const loc = Date.now() + (S.startAt - S.now), trick = S.kind === 'trick' ? S.me.trick : null;
    if (Date.now() > loc + S.dur) { R.stop('Tempo!'); return; }
    if (S.kind === 'trick' && trick == null) { curRun = -3; R.start({ avatar: S.me ? S.me.av : myAv, trick: null, kind: 'practice', L: 1e9, startAt: Date.now() }); return; }
    R.start({ avatar: S.me ? S.me.av : myAv, trick, kind: S.kind, L: S.kind === 'final' ? 60000 : 12000, startAt: loc, endAt: loc + S.dur });
  } else if (S.phase === 'lobby') {
    if (curRun !== -2) { curRun = -2; R.start({ avatar: S.me ? S.me.av : myAv, trick: null, kind: 'practice', L: 1e9, startAt: Date.now() }); }
  } else if (curRun !== -9) { curRun = -9; R.stop(); }
}
function gameText() {
  let t = '';
  if (S.phase === 'lobby') t = `<b>Você entrou!</b> Treine pulando. Todos precisam chegar ao final. Espere o professor.`;
  else if (S.phase === 'run' && S.kind === 'trick' && S.me.trick == null) t = 'Você entrou no meio da rodada. Treine até a próxima.';
  else if (S.phase === 'run') t = S.kind === 'final' ? '<b>CORRIDA FINAL!</b> Sem truques. Todos têm que chegar!' : 'Pule com <b>ESPAÇO</b> ou <b>↑</b>. Abaixe com <b>↓</b>.';
  $('gtxt').innerHTML = t;
}
function reportHTML() {
  const me = S.me;
  if (me.trick == null) return `<div class="card"><h2>VOCÊ ENTROU NO MEIO</h2><p>Não deu tempo de viver um truque. Escute os colegas.</p><div class="act"><button class="btn big" onclick="ready()">JÁ LI</button></div></div>`;
  const T = TRK[me.trick];
  return `<div class="card no"><div class="hero"><div class="big-e">${Pix.img(Pix.icon(me.trick), 80)}</div><div><div class="lbl mut" style="font-size:10px;margin-bottom:8px">O JOGO TRAPACEOU COM VOCÊ</div><h2 style="margin:0">${T.n}</h2></div></div>
    <p style="font-size:1.15em">${T.d}</p>
    <div class="stats"><span class="stat">${me.c} ${me.c === 1 ? 'BATIDA' : 'BATIDAS'}</span><span class="stat">${me.ct} DO TRUQUE</span></div>
    <div class="act" id="rdy"></div></div>`;
}
function renderReport() {
  setView('report', 'r' + S.runId, reportHTML());
  const el = $('rdy') || $('v-report').querySelector('.act');
  const done = readyRun === S.runId || S.me.ready;
  if (el) el.innerHTML = done ? `<span class="pill ok">AGUARDANDO: ${S.nr} DE ${S.n} JÁ LERAM</span>` : `<button class="btn big" onclick="ready()">JÁ LI</button>`;
}
function renderStudent() {
  const me = S.me;
  if (!me) { show('pick'); const taken = S.team.map(t => t.av); setView('pick', 'p' + taken.join(), `<div class="card"><h1>ESCOLHA SEU PERSONAGEM</h1><p class="mut">Todos precisam chegar <b>juntos</b> ao final. O Jogo vai tentar impedir.</p>${err ? `<p><b>${err}</b></p>` : ''}<div class="av-pick">${EM.map((e, i) => `<button ${taken.includes(e) ? 'disabled' : ''} onclick="join('${e}')" aria-label="Personagem ${i + 1}">${Pix.img(e, 56)}</button>`).join('')}</div></div>`); return; }
  const ph = S.phase, v = { lobby: 'game', run: 'game', report: 'report', discuss: 'discuss', vote: 'vote', result: 'result', end: 'end' }[ph];
  show(v);
  if (v === 'game') { gameSync(); gameText(); renderStrip(); }
  else if (curRun !== -9) { curRun = -9; ensureRunner().stop(); }
  if (ph === 'report') renderReport();
  else if (ph === 'discuss') setView('discuss', 'd' + S.runId, `<div class="card"><h2>HORA DE CONVERSAR</h2>
    <div class="say">${Pix.img('friend', 44)}<p>O que apareceu na SUA tela?</p></div>
    <div class="say">${Pix.img('bear', 44)}<p>Era falta de habilidade ou o jogo estava armado?</p></div>
    <div class="say q">${Pix.img('shield', 44)}<p>O que um jogo precisa prometer para ser justo?</p></div>
    <p class="mut blink" style="margin-top:16px">Esperem o professor abrir a votação…</p></div>`);
  else if (ph === 'vote') {
    setView('vote', 'v' + S.runId + S.cards.join() + me.vote, `<div class="card"><h2>VOTEM NA REGRA</h2><p class="mut">${me.vote < 0 ? 'A mais votada vale para todos. Conversem antes!' : 'Voto registrado. Pode trocar até o professor encerrar.'}</p><div class="grid">${rulesCards(S.cards, me.vote, true)}</div><p class="mut" id="nv"></p></div>`);
    $('nv').textContent = S.nv + ' de ' + S.n + ' já votaram';
  }
  else if (ph === 'result') renderResult();
  else if (ph === 'end') renderEnd();
}
function renderResult() {
  const id = S.res, r = RULES[id], me = S.me, c = S.counts || [];
  const tally = rulesCards(S.cards, -1, false, i => `<div class="bar"><i style="width:${S.n ? c[i] / S.n * 100 : 0}%"></i></div><small>${c[i]} voto${c[i] === 1 ? '' : 's'}</small>`);
  let h;
  if (id < 10) {
    const mine = me.trick === id, left = S.alive.length;
    h = `<div class="card ok"><div class="hero"><div class="big-e">${Pix.img(Pix.icon(id), 80)}</div><div><div class="lbl mut" style="font-size:10px;margin-bottom:8px">REGRA APROVADA</div><h2 style="margin:0">${r.t}</h2></div></div>
      <p style="font-size:1.15em"><b>${TRK[id].n}</b> sumiu para todo mundo.</p>
      <div class="say q">${Pix.img('shield', 40)}<p>${r.k}</p></div>
      <p class="mut" style="margin-top:12px">${mine ? 'Era o truque do SEU jogo!' : (S.freed === 1 ? 'Libertou 1 colega.' : 'Libertou ' + S.freed + ' colegas.')} ${left ? 'Restam ' + left + '. Eles mudam de alvo.' : 'Agora é a corrida final!'}</p></div>`;
  } else h = `<div class="card no"><h2>${r.t}</h2><p style="font-size:1.1em">${r.n}</p><p class="mut">Os truques continuam e mudam de alvo. Tentem de novo!</p></div>`;
  setView('result', 'x' + S.runId + id, h + `<div class="card"><h2>COMO FOI A VOTAÇÃO</h2><div class="grid">${tally}</div></div><p class="act mut blink">Esperem o professor começar…</p>`);
}
function renderEnd() {
  if (S.allFin) setView('end', 'win', `<div class="card ok"><div class="hero"><div class="big-e">${Pix.img('trophy', 96)}</div><div><h1 style="margin:0">VOCÊS VENCERAM!</h1><p class="mut" style="margin:8px 0 0">Todo mundo chegou junto.</p></div></div>
    <h2 style="margin-top:18px">REGRAS QUE VOCÊS CRIARAM</h2>
    <div class="chips">${S.adopted.map(i => `<div class="chip">${Pix.img(Pix.icon(i), 40)}<div><b>${RULES[i].t}</b>${RULES[i].k}</div></div>`).join('')}</div>
    ${S.skipped ? '<p class="mut">O professor pulou direto para a final.</p>' : ''}
    <div class="say q">${Pix.img('shield', 48)}<p>Isso é o <b>ECA Digital</b>: uma lei que protege vocês sem tirar o direito de jogar.</p></div>
    <div class="say">${Pix.img('friend', 44)}<p class="blink" style="animation-duration:2s">Qual truque foi o mais difícil de perceber?</p></div></div>`);
  else setView('end', 'lose' + S.runId, `<div class="card no"><h1>QUASE!</h1><p style="font-size:1.15em">O tempo acabou antes de todos chegarem. O que aconteceu? O professor pode abrir outra tentativa.</p></div>`);
}

// ---------- professor ----------
function H(a) { if (a === 'reset' && !confirm('Reiniciar tudo? Todos os alunos terão que escolher personagem de novo.')) return; if (a === 'finalnow' && !confirm('Pular direto para a corrida final? Os truques restantes serão removidos.')) return; post('/host', { pin, a }); }
const B = (a, l, c) => `<button class="${c || 'btn big'}" onclick="H('${a}')">${l}</button>`;
function stateOf(t) {
  if (S.phase === 'run') return t.f ? '<span class="pill ok">chegou</span>' : t.c ? '<span class="pill no">correndo, bateu ' + t.c + '</span>' : '<span class="pill">correndo</span>';
  if (S.phase === 'report') return t.r ? '<span class="pill ok">já leu</span>' : '<span class="pill">lendo…</span>';
  return '';
}
function renderHost() {
  const ph = S.phase, lab = { lobby: 'Sala de espera', run: S.kind === 'final' ? 'Corrida final' : 'Corrida com truques', report: 'Relatórios pessoais', discuss: 'Conversa em grupo', vote: 'Votação', result: 'Resultado da votação', end: 'Fim' }[ph];
  let left = '';
  if (ph === 'run') { const rem = Math.round((S.startAt - S.now + S.dur - (Date.now() - recv)) / 1000); left = rem > S.dur / 1000 ? ' · começa em ' + Math.ceil(rem - S.dur / 1000) + 's' : S.kind === 'final' ? ' · limite em ' + Math.max(0, rem) + 's' : ' · restam ' + Math.max(0, rem) + 's'; }
  let ctrl = '', tip = '';
  if (ph === 'lobby') { ctrl = B('start', 'Começar a primeira rodada').replace('class="btn big"', `class="btn big" ${S.n ? '' : 'disabled'}`); tip = `Peça aos alunos para abrirem <b>${esc(location.origin)}</b> e escolherem um personagem. Eles já podem treinar.`; }
  else if (ph === 'run') { ctrl = B('endrun', 'Encerrar a rodada agora', 'ghost'); tip = S.kind === 'final' ? 'Todos correndo sem truques. A rodada acaba quando o último chega.' : 'Cada aluno tem um truque diferente. Ninguém consegue chegar. Observe a tabela.'; }
  else if (ph === 'report') { ctrl = B('force', 'Seguir para a conversa mesmo sem todos', 'ghost'); tip = `Cada aluno está lendo o que o Jogo fez com ele. <b>${S.nr} de ${S.n}</b> já clicaram em "Já li".`; }
  else if (ph === 'discuss') { ctrl = B('vote', 'Abrir a votação'); tip = 'Conduza a conversa em voz alta: o que apareceu na tela de cada um? Era falta de habilidade ou o jogo estava armado?'; }
  else if (ph === 'vote') { ctrl = B('close', 'Encerrar a votação').replace('class="btn big"', `class="btn big" ${S.nv ? '' : 'disabled'}`); tip = `<b>${S.nv} de ${S.n}</b> votaram. Deixe a turma debater antes de encerrar.`; }
  else if (ph === 'result') { ctrl = B('next', S.alive.length ? 'Próxima rodada' : 'Começar a corrida final'); tip = 'Comente com a turma o que a regra aprovada resolve.'; }
  else { ctrl = (S.allFin ? '' : B('again', 'Tentar a corrida final de novo')); tip = S.allFin ? 'Todos chegaram. Feche com a conversa sobre o ECA Digital.' : 'Nem todos chegaram a tempo.'; }
  let extra = '';
  if (ph === 'vote' || ph === 'result') { const c = S.counts || []; extra = `<div class="card"><h2>Votos</h2><div class="grid">${rulesCards(S.cards, ph === 'result' ? S.cards.indexOf(S.res) : -1, false, i => `<div class="bar"><i style="width:${S.n ? c[i] / S.n * 100 : 0}%"></i></div><small>${c[i] || 0} voto${c[i] === 1 ? '' : 's'}</small>`)}</div></div>`; }
  const rows = S.team.map(t => `<tr><td class="e">${Pix.img(t.av, 34)}</td><td>${t.trick != null && ph !== 'lobby' && S.kind !== 'final' ? Pix.img(Pix.icon(t.trick), 20) + ' ' + TRK[t.trick].n : '—'}</td><td>${stateOf(t)}</td><td>${t.c}</td><td>${Math.round(t.p * 100)}%</td></tr>`).join('');
  const alive = [0, 1, 2, 3, 4].map(i => S.alive.includes(i) ? `<span class="pill no">${Pix.img(Pix.icon(i), 18)} ativo</span>` : `<span class="pill ok">${Pix.img(Pix.icon(i), 18)} removido</span>`).join(' ');
  const skip = ['report', 'discuss', 'vote', 'result'].includes(ph) && S.alive.length ? B('finalnow', 'Pular para a corrida final', 'warn') : '';
  $('host').innerHTML = `${off ? '<div class="conn">Sem conexão. Tentando de novo...</div>' : ''}
   <div class="top"><span>Painel do professor</span><span>${lab}${left}</span><span>Rodada ${S.round} · ${S.n} aluno${S.n === 1 ? '' : 's'}</span></div>
   <div class="card"><h2>${lab}</h2><p>${tip}</p><div class="act">${ctrl}</div></div>
   <div class="card"><h2>Truques do Jogo</h2><p>${alive}</p></div>${extra}
   <div class="card"><h2>Alunos</h2><table><tr><th></th><th>Truque no jogo dele</th><th>Estado</th><th>Batidas</th><th>Chegou a</th></tr>${rows || '<tr><td colspan="5" class="mut">Ninguém entrou ainda.</td></tr>'}</table></div>
   <div class="act">${skip}${B('reset', 'Reiniciar tudo', 'ghost')}</div>`;
}

function render() {
  if (!S) return;
  if (HOST) { $('app').hidden = true; $('host').hidden = false; renderHost(); return; }
  $('bar').innerHTML = (off ? '<div class="conn">Sem conexão. Tentando de novo...</div>' : '') + `<div class="top"><span>Atravessem a Trilha</span><span>${S.phase === 'lobby' ? 'Sala de espera' : 'Rodada ' + S.round}</span><span>${S.n} jogador${S.n === 1 ? '' : 'es'}</span></div>`;
  renderStudent();
}
if (HOST) setInterval(() => { if (S && S.phase === 'run') renderHost(); }, 1000);
start();

</script>
